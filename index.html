<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14263D">
<meta name="description" content="Gestão financeira familiar - importação de extratos, análise inteligente e backup criptografado">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Smart Finance Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root { --ink:#14263D; --brass:#B98A2F; --pos:#1E7D5A; --neg:#C0392B; --neutral:#5A6B7F; --bg:#F4F6F8; }
* { box-sizing:border-box; margin:0; }
body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:#1B2A3A; padding-bottom:76px; font-size:18px; }
.avaliacao-banner { background:var(--brass); color:#14263D; font-weight:600; font-size:0.92rem; padding:9px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.avaliacao-banner a { color:#14263D; text-decoration:underline; font-weight:700; white-space:nowrap; }

/* ── tutorial interativo ── */
.tutorial-spotlight { position:relative; z-index:201; box-shadow:0 0 0 4px rgba(185,138,47,.9), 0 0 24px 6px rgba(185,138,47,.6); border-radius:10px; animation:tutorialPulse 1.4s ease-in-out infinite; }
@keyframes tutorialPulse { 0%,100% { box-shadow:0 0 0 4px rgba(185,138,47,.9), 0 0 18px 4px rgba(185,138,47,.55); } 50% { box-shadow:0 0 0 6px rgba(185,138,47,.6), 0 0 28px 10px rgba(185,138,47,.35); } }
.tutorial-overlay { position:fixed; left:12px; right:12px; bottom:84px; z-index:200; display:flex; gap:10px; align-items:flex-end; animation:tutorialSlideIn .35s ease-out; pointer-events:none; }
@keyframes tutorialSlideIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.tutorial-avatar { flex:0 0 52px; width:52px; height:52px; border-radius:50%; overflow:hidden; background:var(--brass); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.3rem; border:2px solid #fff; box-shadow:0 2px 10px rgba(20,38,61,.3); }
.tutorial-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.tutorial-balao { pointer-events:auto; position:relative; flex:1; max-width:420px; background:#fff; border:1px solid #DDE3EA; border-radius:16px; padding:14px 16px; box-shadow:0 8px 28px rgba(20,38,61,.22); }
.tutorial-balao::before { content:''; position:absolute; left:-7px; bottom:16px; width:14px; height:14px; background:#fff; border-left:1px solid #DDE3EA; border-bottom:1px solid #DDE3EA; transform:rotate(45deg); }
.tutorial-nome { font-weight:700; color:var(--ink); font-size:.8rem; margin-bottom:4px; }
.tutorial-fala { font-size:.96rem; line-height:1.4; color:var(--ink); }
.tutorial-fechar { position:absolute; top:6px; right:8px; border:none; background:none; color:var(--neutral); font-size:1.1rem; line-height:1; cursor:pointer; padding:4px; }
.tutorial-opcoes { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
.tutorial-btn { padding:10px 14px; border-radius:10px; border:none; background:var(--brass); color:#fff; font-weight:700; font-size:.92rem; cursor:pointer; }
.tutorial-btn:nth-child(2) { background:#EAEFF4; color:var(--ink); }
.tutorial-btn:nth-child(3) { background:#EAEFF4; color:var(--ink); }

.guia { display:flex; gap:12px; align-items:flex-start; margin:0 0 16px; }
.guia-avatar { flex:0 0 60px; width:60px; height:60px; border-radius:50%; overflow:hidden; background:var(--brass); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.5rem; border:2px solid #fff; box-shadow:0 2px 8px rgba(20,38,61,.2); }
.guia-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.guia-balao { position:relative; flex:1; background:#fff; border:1px solid #DDE3EA; border-radius:14px; padding:12px 14px; font-size:.98rem; line-height:1.45; box-shadow:0 2px 10px rgba(20,38,61,.06); }
.guia-balao::before { content:''; position:absolute; left:-8px; top:20px; width:14px; height:14px; background:#fff; border-left:1px solid #DDE3EA; border-bottom:1px solid #DDE3EA; transform:rotate(45deg); }
.guia-nome { font-weight:700; color:var(--ink); font-size:.82rem; margin-bottom:3px; }
.guia-passos { list-style:none; padding:0; margin:10px 0 0; }
.guia-passos li { display:flex; gap:8px; padding:4px 0; font-size:.92rem; }
.guia-passos .ok { color:var(--pos); font-weight:700; }
.guia-passos .pend { color:var(--neutral); }
header { background:var(--ink); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-family:'Archivo',sans-serif; font-size:1.3rem; letter-spacing:-0.01em; }
header h1 span { color:var(--brass); }
main { max-width:680px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
h3 { font-family:'Archivo',sans-serif; font-size:1.25rem; margin-bottom:10px; }
.card { background:#fff; border-radius:14px; padding:14px; box-shadow:0 1px 3px rgba(20,38,61,.08); }
.hero { background:var(--ink); color:#fff; border-radius:16px; padding:20px; }
.hero-label { opacity:.7; font-size:1rem; }
.hero-value { font-family:'Archivo',sans-serif; font-size:2.4rem; font-weight:700; margin:4px 0 10px; }
.hero-split { display:flex; gap:28px; }
.hero-split span { display:block; opacity:.7; font-size:0.9rem; }
.hero-split b { font-family:'Archivo',sans-serif; font-size:1.3rem; }
.brass { color:var(--brass); }
.flow { display:flex; gap:10px; }
.flow>div { flex:1; }
.flow span { display:block; color:var(--neutral); font-size:0.9rem; }
.flow b { font-family:'Archivo',sans-serif; font-size:1.15rem; }
.pos { color:var(--pos); } .neg { color:var(--neg); } .neutral { color:var(--neutral); }
.row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #EEF1F4; }
.row:last-child { border-bottom:none; }
.row.review { align-items:flex-start; }
.grow { flex:1; min-width:0; }
.desc { font-size:1.05rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.review .desc { white-space:normal; }
.sub { font-size:0.9rem; color:var(--neutral); }
.amt { font-weight:600; font-size:1.05rem; white-space:nowrap; }
.dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.chip { display:inline-block; background:#EEF1F4; color:var(--ink); border-radius:999px; padding:2px 10px; font-size:0.85rem; font-weight:600; margin:3px 4px 0 0; }
.neutral-chip { color:var(--neutral); }
.brass-chip { background:var(--brass); color:#fff; }
.chips { display:flex; flex-wrap:wrap; }
.banner { background:#E7EEF6; border-radius:12px; padding:11px 14px; font-size:1rem; }
.banner.ok { background:#E4F2EC; }
.banner.warn { background:#FBF0DC; }
.warn-chip { background:#B98A2F; color:#fff; }
.ok-chip { background:#E4F2EC; color:var(--pos); }
.warn-mark { color:#B98A2F; }
.hero-warn { margin-top:12px; font-size:0.95rem; background:rgba(185,138,47,.22); color:#F0D9A8; border-radius:9px; padding:7px 10px; }
.hero-ok { margin-top:12px; font-size:0.95rem; opacity:.65; }
table.audit { width:100%; border-collapse:collapse; font-size:0.95rem; margin-top:6px; }
table.audit th { text-align:left; color:var(--neutral); font-weight:600; font-size:0.85rem; padding:5px 4px; border-bottom:1px solid #EEF1F4; }
table.audit td { padding:7px 4px; border-bottom:1px solid #EEF1F4; vertical-align:top; }
table.audit tr.bad td { background:#FCF7EC; }
table.audit tr.detail td { background:#FCF7EC; font-size:0.9rem; }
table.audit ul { margin:6px 0 4px 16px; }
table.audit li { margin-bottom:4px; line-height:1.35; }
table.audit td.rt { text-align:right; white-space:nowrap; }
table.audit tr.good td { background:#E9F4EF; }
.suggestion { margin-top:6px; padding:8px 10px; background:#F4F6F8; border-left:3px solid var(--brass);
  border-radius:6px; font-size:0.95rem; line-height:1.4; }
.dupcluster { border-top:1px solid #EEF1F4; padding-top:8px; margin-top:8px; }
.dupcluster:first-child { border-top:none; margin-top:0; }
.chip.removable { display:inline-flex; align-items:center; gap:5px; padding-right:6px; }
.chip-x { background:none; border:none; color:var(--neutral); font-size:.95rem; line-height:1; cursor:pointer; padding:0 2px; font-family:inherit; }
.chip-x:active { color:var(--neg); }
textarea { width:100%; font-family:inherit; font-size:0.95rem; padding:10px; border:1px solid #D7DEE6; border-radius:11px; margin-bottom:8px; }
.chip.clickable { cursor:pointer; border:none; font-family:inherit; }
.chip.sel { background:var(--ink); color:#fff; }
.inv { border-top:1px solid #EEF1F4; padding-top:8px; margin-top:10px; }
.inv:first-of-type { border-top:none; }
.opt { border:1px solid #E4E9EF; border-radius:12px; padding:10px; margin-top:9px; }
.opt.good { border-color:#BFDCCF; background:#F5FBF8; }
.warnline { font-size:0.9rem; color:#8A6516; background:#FBF0DC; border-radius:8px; padding:5px 8px; margin-top:5px; }
.src { font-size:0.85rem; opacity:.75; margin-top:5px; }
label.check { display:flex; align-items:center; gap:8px; font-size:1rem; margin-bottom:10px; }
label.check input { width:auto; }
nav button { font-size:0.8rem; }
.scrollx { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; }
table.cons { min-width:560px; }
table.cons th, table.cons td { white-space:nowrap; }
.clickable-row { cursor:pointer; }
.menuico { width:30px; text-align:center; font-size:1.15rem; color:var(--ink); }
.spark { width:100%; height:120px; display:block; margin:6px 0 2px; }
.sparklabels { display:flex; justify-content:space-between; font-size:0.8rem; color:var(--neutral); margin-bottom:8px; }
.budget { padding:8px 0; border-bottom:1px solid #EEF1F4; }
.budget:last-child { border-bottom:none; }
.budget .row { border-bottom:none; padding:2px 0; }
.bar { height:7px; background:#EEF1F4; border-radius:999px; overflow:hidden; margin-top:5px; }
.bar div { height:100%; border-radius:999px; }
.diag { margin-top:4px; line-height:1.35; }
.bar-ok { background:var(--pos); } .bar-warn { background:var(--brass); } .bar-neg { background:var(--neg); } .bar-ink { background:var(--ink); opacity:.75; }
.calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.calhead h3 { margin:0; }
.calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.calweek { margin-bottom:4px; }
.calwd { text-align:center; font-size:0.8rem; color:var(--neutral); font-weight:600; }
.calday { aspect-ratio:1; border-radius:9px; background:#F7F9FB; padding:3px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; }
.calday.out { opacity:.32; }
.calday.today { outline:2px solid var(--ink); }
.calday.sel { background:#E7EEF6; }
.caldnum { font-size:0.9rem; font-weight:600; line-height:1.1; }
.caldots { display:flex; gap:2px; margin-top:1px; }
.caldots i { width:5px; height:5px; border-radius:50%; display:block; }
.dot-done { background:var(--ink); } .dot-plan { background:var(--brass); } .dot-late { background:var(--neg); }
.callegend { display:flex; gap:12px; justify-content:center; margin-top:10px; font-size:0.85rem; color:var(--neutral); }
.callegend span { display:flex; align-items:center; gap:4px; }
.callegend i { width:6px; height:6px; border-radius:50%; display:block; }
.caldval { font-size:0.7rem; margin-top:1px; font-weight:600; }
.eye-btn { background:rgba(255,255,255,.12); border:none; border-radius:10px; width:36px; height:36px;
  font-size:1.05rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.eye-btn:active { background:rgba(255,255,255,.22); }
.biometric-btn { background:linear-gradient(135deg, #1E7D5A 0%, #156b4a 100%); color:#fff; width:100%; padding:16px; font-size:1.2rem; font-weight:600; border:none; border-radius:11px; cursor:pointer; margin-top:12px; display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.2s; }
.biometric-btn:active { transform:scale(0.98); opacity:0.9; }
.biometric-btn:disabled { opacity:0.5; cursor:not-allowed; }
ol { font-size:1rem; line-height:1.6; }
ol li { margin-bottom:8px; }
body.locked nav { display:none; }
body.locked .eye-btn { display:none; }
body.locked header { text-align:center; }
.lockcard { max-width:420px; margin:8vh auto 0; padding:20px; }
.lockcard h2 { font-family:'Archivo',sans-serif; font-size:1.8rem; margin-bottom:16px; font-weight:700; }
.lockcard p { margin-bottom:20px; font-size:1.2rem; line-height:1.5; }
.lockcard .btns { justify-content:center; }
.landing-hero { max-width:460px; margin:0 auto; padding:32px 22px 28px; text-align:center; min-height:100vh; box-sizing:border-box; display:flex; flex-direction:column; }
.landing-hero h1 { font-family:'Archivo',sans-serif; font-size:1.7rem; font-weight:800; color:var(--ink); line-height:1.25; margin:0 0 14px; }
.landing-hero .sub { font-size:1.05rem; line-height:1.5; color:var(--neutral); margin:0 0 22px; }
.landing-cta { display:block; background:var(--pos); color:#fff; font-weight:700; font-size:1.15rem; text-decoration:none;
  border-radius:14px; padding:18px 20px; margin:0 0 12px; box-shadow:0 6px 18px rgba(30,125,90,.28); }
.landing-cta-secondary { background:none; border:none; color:var(--neutral); font-size:.95rem; font-weight:600;
  text-decoration:underline; padding:8px; margin:0 0 32px; cursor:pointer; }
.landing-icons { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; font-size:.88rem; color:var(--ink);
  font-weight:600; margin-bottom:auto; padding-bottom:40px; }
.landing-icons span { background:#fff; border:1px solid #E3E7EC; border-radius:20px; padding:8px 14px; }
.landing-footer { margin-top:24px; }
.landing-footer button { background:none; border:none; color:var(--neutral); font-size:.85rem; text-decoration:underline; cursor:pointer; padding:6px; font-weight:500; }
.landing-footer #landing-legal { text-align:left; margin-top:14px; background:#fff; border-radius:12px; padding:16px; }
.reccode { font-family:ui-monospace,Menlo,monospace; font-size:1.05rem; letter-spacing:.06em; text-align:center;
  background:#F4F6F8; border:1px dashed var(--brass); border-radius:12px; padding:14px; margin:10px 0; word-break:break-all; }
.modal { position:fixed; inset:0; background:rgba(20,38,61,.55); z-index:20; display:flex; align-items:center; padding:16px; }
.modal .lockcard { margin:0 auto; width:100%; }
.hint { font-size:0.88rem; color:var(--neutral); margin-top:8px; }
.empty { color:var(--neutral); font-size:1rem; padding:6px 0; }
.error { background:#F9E5E1; color:var(--neg); border-radius:12px; padding:11px 14px; font-size:1rem; }
button, .btn-file { font-family:inherit; font-weight:600; font-size:1.05rem; border:none; border-radius:11px; padding:11px 16px; cursor:pointer; }
.primary { background:var(--ink); color:#fff; display:inline-block; }
.primary:disabled { opacity:.4; }
.primary.big { width:100%; padding:14px; font-size:1rem; }
.ghost { background:transparent; color:var(--ink); }
.sm { padding:7px 12px; font-size:.8rem; }
.right { float:right; }
.center { text-align:center; }
.center p { margin:8px 0 14px; }
.btn-file input { display:none; }
select, input[type=text], input:not([type]) { width:100%; font-family:inherit; font-size:1.05rem; padding:15px 14px; border:1px solid #D7DEE6; border-radius:11px; background:#fff; margin-bottom:16px; line-height:1.5; }
input[type=password] { width:100%; font-family:inherit; font-size:1.3rem; padding:18px 14px; border:1px solid #D7DEE6; border-radius:11px; background:#fff; margin-bottom:18px; line-height:1.8; letter-spacing:0.3em; }
select.cat { margin:8px 0 0; padding:8px; font-size:0.95rem; }
.form { padding:10px 0; }
.form.hidden, .hidden { display:none; }
.limitbar { height:10px; background:#EEF1F4; border-radius:999px; overflow:hidden; margin:10px 0 6px; }
.limitfill { height:100%; background:var(--pos); border-radius:999px; transition:width .3s; }
.limitfill.warn { background:var(--brass); }
.limitfill.danger { background:var(--neg); }
.chip.warn { background:#FBF0DC; color:#8A6516; }
.chip.danger { background:#F9E5E1; color:var(--neg); }
.chip.good { background:#E9F4EF; color:var(--pos); }
.suggest { border-bottom:1px solid #EEF1F4; padding:10px 0; }
.suggest:last-child { border-bottom:none; }
.btns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
nav { position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; box-shadow:0 -1px 6px rgba(20,38,61,.10); z-index:10; padding-bottom:env(safe-area-inset-bottom); }
nav button { flex:1; background:none; color:var(--neutral); font-size:.72rem; padding:9px 0 7px; border-radius:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
nav button.active { color:var(--ink); }
nav .ico { font-size:1.25rem; line-height:1; }
input[type=checkbox] { width:18px; height:18px; margin-top:2px; accent-color:var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Smart Finance <span>Family</span></h1>
  <button id="eye-toggle" class="eye-btn" onclick="toggleEye()" title="Mostrar valores" aria-label="Mostrar valores">🙈</button>
</header>
<main id="view"></main>
<nav>

<script>/* ═══════════ Segurança, autenticação e proteção de dados (seção 11) ═══════════
   Tudo local: nenhuma senha, chave ou dado sai do aparelho.
   Modelo: uma CHAVE MESTRA aleatória cifra os dados (AES-GCM 256).
   Essa chave mestra é guardada apenas "embrulhada" por cada método de acesso
   (senha, PIN, código de recuperação, biometria). Sem um deles, o conteúdo é
   matematicamente irrecuperável — inclusive por mim. Não existe porta dos fundos. */
'use strict';

const SFSec = (() => {
  const VAULT_KEY = 'sf-vault-v1';
  const LEGACY_KEY = 'sf-family-v1';
  const KDF_ITER_PASSWORD = 600000;  // OWASP 2023+ para PBKDF2-SHA256
  const KDF_ITER_PIN = 1200000;      // PIN tem pouca entropia: dobra o custo de cada tentativa
  const enc = new TextEncoder(), dec = new TextDecoder();

  // estoura a pilha de chamadas quando há muitos dados (centenas de lançamentos),
  // fazendo a gravação falhar silenciosamente.

      { name: 'PBKDF2', salt: unb64(saltB64), iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt'],
    );

  // outra aba gravou depois. Sem isso, fechar uma aba velha apaga dados novos.
  let knownRev = 0;
  let lastSaveError = null;   // mensagem do último erro de gravação (null = tudo certo)
  let lastSaveAt = null;      // quando gravou com sucesso pela última vez

  const readVault = () => { try { const r = localStorage.getItem(VAULT_KEY); return r ? JSON.parse(r) : null; } catch { return null; } };

  function newRecoveryCode() {

    v.meta.failedAttempts = 0; v.meta.lockedUntil = null;

  const bioAvailable = () => !!(window.PublicKeyCredential && window.isSecureContext);

  async function prfKey(credentialId, saltB64) {
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: rand(32),

        userVerification: 'required',

      },
    });

    const { key, credentialId } = await prfKey(b64(cred.rawId), salt);

  }
  async function unlockBiometric() {

    return unlockWithKey(key, 'BIOMETRIA');
  }
  function disableBiometric() { const v = readVault(); delete v.wraps.biometric; writeVault(v); }

  /* ── backup cifrado ── */
  async function exportEncrypted(state, password) {
    const salt = b64(rand(16));
    const key = await deriveKey(password, salt, KDF_ITER_PASSWORD);
    const blob = await aesEncrypt(key, enc.encode(JSON.stringify(state)));

  }
  async function importEncrypted(fileText, password) {
    const f = JSON.parse(fileText);
    if (f.format !== 'smart-finance-backup') throw new Error('Arquivo não é um backup do Smart Finance.');
    if (!f.encrypted) return f.state; // backup antigo, sem criptografia

    try {
      const bytes = await aesDecrypt(key, f);
      return JSON.parse(dec.decode(bytes));
    } catch { throw new Error('Senha incorreta para este backup.'); }
  }

  /* ── migração dos dados antigos, gravados sem criptografia ── */
  function legacyState() { try { const r = localStorage.getItem(LEGACY_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }

  return {
    hasVault, createVault, unlock, unlockBiometric, lock, isUnlocked, scheduleSave, save, flushSave,

    regenerateRecovery, enableBiometric, disableBiometric, bioAvailable,
    exportEncrypted, importEncrypted, legacyState, dropLegacy, logEvent, deviceLabel,
    lockoutState, registerFailure,
    saveHealth: () => ({ error: lastSaveError, lastSaveAt, rev: knownRev }),
  };
})();

    if (!st.marketOptions || !st.marketOptions.length) st.marketOptions = seedOptions();
    st.accounts.forEach((a) => {
      if (a.anchorBalance === undefined && a.openingBalance) { a.anchorBalance = a.openingBalance; a.anchorDate = null; a.anchorFromUser = true; }

// ───────── consultas ─────────
const INVESTED_TYPES = ['COFRINHO', 'INVESTIMENTO', 'POUPANCA'];
const CARD_TYPES = ['CARTAO'];
const isCard = (a) => CARD_TYPES.includes(a.type);

/* ═══════════ Cartão de crédito ═══════════
   A compra é a despesa (entra na data em que aconteceu, com categoria) mas não
   sai do banco. O pagamento da fatura é uma transferência entre a conta e o
   cartão — por isso os dois lançamentos recebem o mesmo linkId e ficam fora do
   fluxo real, evitando contar o mesmo gasto duas vezes. */

const clampDay = (ym, day) => {
  const [y, m] = ym.split('-').map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return `${ym}-${String(Math.min(day, last)).padStart(2, '0')}`;
};

/** Descobre em qual fatura uma compra cai, a partir do dia de fechamento. */
function cycleOf(card, date) {
  const closingDay = card.closingDay || 1;
  const dueDay = card.dueDay || closingDay;
  const ym = date.slice(0, 7);
  const day = Number(date.slice(8, 10));
  // compra feita depois do fechamento entra na fatura do mês seguinte
  const closeYm = day > closingDay ? SFCore.addMonths(ym, 1) : ym;
  const closeDate = clampDay(closeYm, closingDay);
  // vencimento: no mesmo mês se o dia for posterior ao fechamento, senão no seguinte
  const dueYm = dueDay > closingDay ? closeYm : SFCore.addMonths(closeYm, 1);
  return { key: closeDate, closeDate, dueDate: clampDay(dueYm, dueDay) };
}

/** Monta todas as faturas do cartão a partir dos lançamentos. */
function invoicesOf(s, card) {
  const txs = s.txs.filter((t) => t.accountId === card.id);
  const map = new Map();
  const ensure = (key) => {
    if (!map.has(key)) {
      const [y, m, d] = key.split('-').map(Number);
      const dueDay = card.dueDay || card.closingDay || 1;
      const dueYm = dueDay > (card.closingDay || 1) ? key.slice(0, 7) : SFCore.addMonths(key.slice(0, 7), 1);
      map.set(key, { key, closeDate: key, dueDate: clampDay(dueYm, dueDay), purchases: [], payments: [] });
    }
    return map.get(key);
  };
  for (const t of txs) {
    if (t.amount > 0) {
      // pagamento abate a fatura que ele quita (marcada no lançamento), não a do mês em que foi pago
      ensure(t.invoiceKey || cycleOf(card, t.date).key).payments.push(t);
    } else {
      ensure(cycleOf(card, t.date).key).purchases.push(t);
    }
  }
  const hoje = today();
  const out = [...map.values()].map((inv) => {
    const total = -inv.purchases.reduce((x, t) => x + t.amount, 0);
    const paid = inv.payments.reduce((x, t) => x + t.amount, 0);
    const open = inv.closeDate > hoje;
    const remaining = total - paid;
    let status;
    if (open) status = 'ABERTA';        // ajustado adiante: a mais próxima fica ABERTA, as demais FUTURA
    else if (remaining <= 0) status = 'PAGA';
    else if (paid > 0) status = 'PARCIAL';
    else if (inv.dueDate < hoje) status = 'VENCIDA';
    else status = 'FECHADA';
    return { ...inv, total, paid, remaining, status, open };
  }).sort((a, b) => b.closeDate.localeCompare(a.closeDate));
  // entre as ainda não fechadas, só a que fecha primeiro é a "atual";
  // as posteriores são parcelas já comprometidas em faturas futuras
  const abertas = out.filter((i) => i.status === 'ABERTA').sort((a, b) => a.closeDate.localeCompare(b.closeDate));
  abertas.slice(1).forEach((i) => { i.status = 'FUTURA'; });
  return out;
}

/** Situação resumida do cartão: fatura atual, próxima a vencer e uso do limite. */
function cardSummary(s, card) {
  const list = invoicesOf(s, card);
  const current = list.find((i) => i.status === 'ABERTA') || null;
  const toPay = list.filter((i) => ['FECHADA', 'PARCIAL', 'VENCIDA'].includes(i.status))
                    .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const debt = -balance(s, card);                    // saldo do cartão é negativo
  const limit = card.creditLimit || 0;
  const available = limit ? limit - debt : null;
  const hoje = today();
  const daysTo = (d) => Math.round((Date.parse(d + 'T00:00:00Z') - Date.parse(hoje + 'T00:00:00Z')) / 86400000);
  // parcelas já lançadas para faturas futuras
  const future = list.filter((i) => i.status === 'FUTURA');
  return {
    card, invoices: list, current, toPay, debt, limit, available,
    usedPct: limit ? Math.min(1, debt / limit) : null,
    daysToClose: current ? daysTo(current.closeDate) : null,
    nextDue: toPay[0] || null,
    daysToDue: toPay[0] ? daysTo(toPay[0].dueDate) : null,
    committedAhead: future.reduce((x, i) => x + i.total, 0),
    bestBuyDay: card.closingDay ? (card.closingDay % 31) + 1 : null,
  };
}
let valuesHidden = true; // privacidade: o app sempre abre com os valores ocultos
const MASK = 'R$ ••••••';
const realBRL = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtBRL = (c) => (valuesHidden ? MASK : realBRL(c));
const isValuesHidden = () => valuesHidden;
function setValuesHidden(v) { valuesHidden = v; }
const fmtDate = (iso) => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const balance = (s, acc) => (acc.anchorBalance || 0) + s.txs.filter((t) => t.accountId === acc.id && t.date <= today()).reduce((sum, t) => sum + t.amount, 0);
const accTxs = (s, accountId) => s.txs.filter((t) => t.accountId === accountId)
  .map((t) => ({ id: t.id, date: t.date, amount: t.amount, descriptionRaw: t.descriptionRaw, descriptionNorm: t.descriptionNorm }));
const openChecks = (s, accountId) => s.checks.filter((c) => c.accountId === accountId && c.status === 'DIVERGENT');
function accountStatus(s, acc) {
  if (openChecks(s, acc.id).length) return 'NECESSITA_CONFERENCIA';
  if (acc.anchorBalance == null) return s.txs.some((t) => t.accountId === acc.id) ? 'SEM_SALDO_BANCO' : 'SEM_ANCORA';
  return 'CONCILIADA';
}
const STATUS_LABEL = {
  NECESSITA_CONFERENCIA: 'Necessita conferência',
  SEM_SALDO_BANCO: 'Sem saldo do banco',
  SEM_ANCORA: 'Aguardando 1º extrato',
  CONCILIADA: 'Conciliada',
};
const personName = (s, id) => (s.people.find((p) => p.id === id) || {}).name || '?';
const accountById = (s, id) => s.accounts.find((a) => a.id === id);
const catName = (s, id) => (s.categories.find((c) => c.id === id) || {}).name || '';
const linkById = (s, id) => s.links.find((l) => l.id === id);

function toMatchTx(s, t) {
  const a = accountById(s, t.accountId);
  return { id: t.id, accountId: t.accountId, ownerName: personName(s, a.ownerId),
           institution: a.institution, date: t.date, amount: t.amount, txType: t.txType,
           counterpartyName: t.counterpartyName, counterpartyDoc: t.counterpartyDoc,
           descriptionNorm: t.descriptionNorm };
}
const isRejected = (s, outId, inId) => s.rejected.includes(outId + '|' + inId);

// ───────── importação ─────────
function previewImport(s, accountId, canonTxs) {
  const existing = s.txs.filter((t) => t.accountId === accountId)
    .map((t) => ({ id: t.id, date: t.date, amount: t.amount, descriptionNorm: t.descriptionNorm, hash: t.hash }));
  const plan = SFCore.planImport(accountId, canonTxs, existing);

  const pool = s.txs.filter((t) => !t.linkId && SFCore.isTransferable(t.txType)).map((t) => toMatchTx(s, t));
  const acc = accountById(s, accountId);
  plan.forEach((row, i) => {
    if (row.verdict === 'DUP_EXACT') return;
    pool.push({ id: 'new:' + i, accountId, ownerName: personName(s, acc.ownerId), institution: acc.institution,
      date: row.tx.date, amount: row.tx.amount, txType: row.tx.txType,
      counterpartyName: row.tx.counterpartyName, counterpartyDoc: row.tx.counterpartyDoc,
      descriptionNorm: row.tx.descriptionNorm });
  });
  const matches = SFCore.matchTransfers(pool).filter((m) => !isRejected(s, m.outId, m.inId));
  const byNew = new Map();
  for (const m of matches) {
    for (const [side, other] of [[m.outId, m.inId], [m.inId, m.outId]]) {
      if (String(side).startsWith('new:')) byNew.set(Number(side.slice(4)), { score: m.score, status: m.status, withId: other });
    }
  }
  const summarize = (id) => {
    if (String(id).startsWith('new:')) { const t = plan[Number(id.slice(4))].tx; return { source: 'este arquivo', desc: t.descriptionRaw, date: t.date }; }
    const t = s.txs.find((x) => x.id === id);
    return t ? { source: accountById(s, t.accountId).name, desc: t.descriptionRaw, date: t.date } : null;
  };
  return plan.map((row, i) => ({
    index: i, tx: row.tx, verdict: row.verdict,
    fuzzyOf: row.fuzzyOfId ? summarize(row.fuzzyOfId) : null,
    suggestedCategoryId: row.verdict === 'NEW' ? SFCore.classify(row.tx, s.rules) : undefined,
    transfer: byNew.get(i) ? { score: byNew.get(i).score, with: summarize(byNew.get(i).withId) } : null,
  }));
}

function rematch(s) {
  for (const l of s.links.filter((x) => x.status === 'SUGGESTED')) {
    s.txs.forEach((t) => { if (t.linkId === l.id) t.linkId = null; });
  }
  s.links = s.links.filter((x) => x.status !== 'SUGGESTED');
  const pool = s.txs.filter((t) => !t.linkId && SFCore.isTransferable(t.txType)).map((t) => toMatchTx(s, t));
  const matches = SFCore.matchTransfers(pool).filter((m) => !isRejected(s, m.outId, m.inId));
  let confirmed = 0, suggested = 0;
  for (const m of matches) {
    const link = { id: uid(), status: m.status, confidence: m.score };
    s.links.push(link);
    s.txs.forEach((t) => { if (t.id === m.outId || t.id === m.inId) t.linkId = link.id; });
    m.status === 'CONFIRMED' ? confirmed++ : suggested++;
  }
  return { confirmed, suggested };
}

function commitImport(s, accountId, fileName, canonTxs, decisions, statement) {
  try { SFTelemetry.trackOnce('first_import'); } catch (e) {}
  const dByIndex = new Map(decisions.map((d) => [d.index, d]));
  const existing = s.txs.filter((t) => t.accountId === accountId)
    .map((t) => ({ id: t.id, date: t.date, amount: t.amount, descriptionNorm: t.descriptionNorm, hash: t.hash }));
  const plan = SFCore.planImport(accountId, canonTxs, existing);
  const meta = (statement && statement.meta) || { hasBalances: false };
  const dailyBalances = (statement && statement.dailyBalances) || [];
  const batch = { id: uid(), accountId, fileName, when: new Date().toISOString(), imported: 0, skipped: 0,
                  status: 'COMMITTED', periodStart: meta.periodStart || null, periodEnd: meta.periodEnd || null,
                  hasBalances: !!meta.hasBalances };
  plan.forEach((row, i) => {
    const d = dByIndex.get(i);
    const include = row.verdict === 'DUP_EXACT' ? false
      : row.verdict === 'DUP_FUZZY' ? (d && d.include === true)
      : !(d && d.include === false);
    if (!include) {
      batch.skipped++;
      if (row.verdict !== 'DUP_EXACT') {
        s.excluded.push({ accountId, batchId: batch.id, date: row.tx.date, amount: row.tx.amount,
                          descriptionRaw: row.tx.descriptionRaw, descriptionNorm: row.tx.descriptionNorm });
      }
      return;
    }
    const suggested = SFCore.classify(row.tx, s.rules);
    const categoryId = (d && d.categoryId) || suggested || null;
    s.txs.push({ id: uid(), accountId, date: row.tx.date, amount: row.tx.amount,
      descriptionRaw: row.tx.descriptionRaw, descriptionNorm: row.tx.descriptionNorm,
      txType: row.tx.txType, counterpartyName: row.tx.counterpartyName || null,
      counterpartyDoc: row.tx.counterpartyDoc || null, categoryId, linkId: null,
      batchId: batch.id, hash: row.hash, seqInDay: row.seqInDay });
    batch.imported++;
    if (d && d.categoryId && d.categoryId !== suggested) {
      const pattern = SFCore.learnPattern(row.tx);
      if (pattern) {
        const dup = s.rules.find((r) => r.pattern === pattern && r.categoryId === d.categoryId && r.priority === 250);
        if (dup) dup.hits++;
        else s.rules.push({ id: uid(), pattern, matchType: 'CONTAINS', field: 'descriptionNorm', categoryId: d.categoryId, priority: 250, hits: 1 });
      }
    }
  });
  s.batches.unshift(batch);
  const links = rematch(s);
  const reconciliation = reconcileAfterImport(s, accountId, batch, canonTxs, meta, dailyBalances);
  return { batchId: batch.id, imported: batch.imported, skipped: batch.skipped, links, reconciliation };
}

/* ───────── Fase 1.5 — âncora automática + conferência (seções 9.1 e 9.3) ───────── */

function reconcileAfterImport(s, accountId, batch, canonTxs, meta, dailyBalances) {
  const acc = accountById(s, accountId);
  if (!acc) return { anchored: false, checks: [] };
  const out = { anchored: false, reanchored: false, checks: [], noBalances: !meta.hasBalances };

  // (a) âncora: primeiro extrato com saldo define a referência — nunca digitada
  const derived = SFCore.deriveAnchor(meta, canonTxs);
  if (derived) {
    if (acc.anchorBalance == null || acc.anchorFromUser) {
      acc.anchorBalance = derived.balance; acc.anchorDate = derived.date;
      acc.anchorBatchId = batch.id; acc.anchorFromUser = false;
      out.anchored = true;
    } else if (acc.anchorDate && derived.date < acc.anchorDate) {
      // extrato mais antigo → re-ancoragem retroativa (seção 9.1)
      const oldAnchorBalance = acc.anchorBalance, oldAnchorDate = acc.anchorDate;
      const bridged = derived.balance + s.txs.filter((t) => t.accountId === accountId && t.date < oldAnchorDate)
        .reduce((x, t) => x + t.amount, 0);
      out.reanchored = true;
      out.anchorBridgeDiff = bridged - oldAnchorBalance;
      acc.anchorBalance = derived.balance; acc.anchorDate = derived.date; acc.anchorBatchId = batch.id;

      // registra a emenda como um check PERMANENTE — sem isso, a divergência (ou a
      // confirmação de que bateu) só aparecia uma vez na tela de import e desaparecia
      const bridgeCauses = out.anchorBridgeDiff !== 0 ? SFCore.diagnose({
        difference: out.anchorBridgeDiff, refDate: oldAnchorDate, anchorBalance: derived.balance,
        systemTxs: accTxs(s, accountId), statementTxs: canonTxs,
        excludedTxs: s.excluded.filter((e) => e.accountId === accountId),
      }) : [];
      const bridgeRec = {
        id: uid(), accountId, batchId: batch.id, fileName: batch.fileName, kind: 'REANCORAGEM',
        checkedAt: new Date().toISOString(), refDate: oldAnchorDate, bankBalance: oldAnchorBalance,
        computedBalance: bridged, difference: out.anchorBridgeDiff,
        txCount: s.txs.filter((t) => t.accountId === accountId && t.date < oldAnchorDate).length,
        status: out.anchorBridgeDiff === 0 ? 'OK' : 'DIVERGENT', causes: bridgeCauses,
      };
      s.checks.unshift(bridgeRec);
      out.checks.push(bridgeRec);

      // a referência mudou: todo check anterior desta conta foi calculado com a
      // âncora antiga e precisa ser recalculado, ou a auditoria mostra números
      // que já não refletem a realidade — e pode até contradizer o check novo
      s.checks.filter((c) => c.accountId === accountId && c.status !== 'RESOLVED' && c.id !== bridgeRec.id)
        .forEach((c) => recheck(s, c.id));
    }
  }
  if (acc.anchorBalance == null) return out;

  // (b) conferência de cada saldo informado pelo banco
  const refs = [];
  if (meta.closingBalance != null) {
    refs.push({ refDate: meta.closingDate || meta.periodEnd || canonTxs.map((t) => t.date).sort().pop(), bankBalance: meta.closingBalance, kind: 'FINAL' });
  }
  const prevBatch = s.batches.filter((b) => b.accountId === accountId && b.id !== batch.id && b.status === 'COMMITTED' && b.periodEnd)
    .sort((a, b) => b.periodEnd.localeCompare(a.periodEnd))[0];

  for (const ref of refs) {
    if (!ref.refDate) continue;
    const sysTxs = accTxs(s, accountId);
    const check = SFCore.runCheck({ anchorBalance: acc.anchorBalance, systemTxs: sysTxs, refDate: ref.refDate, bankBalance: ref.bankBalance });
    const causes = check.status === 'DIVERGENT' ? SFCore.diagnose({
      difference: check.difference, refDate: ref.refDate, anchorBalance: acc.anchorBalance,
      systemTxs: sysTxs, statementTxs: canonTxs,
      excludedTxs: s.excluded.filter((e) => e.accountId === accountId),
      dailyBalances, previousPeriodEnd: prevBatch ? prevBatch.periodEnd : undefined,
      periodStart: meta.periodStart,
    }) : [];
    const rec = { id: uid(), accountId, batchId: batch.id, fileName: batch.fileName, kind: ref.kind,
                  checkedAt: new Date().toISOString(), refDate: ref.refDate, bankBalance: ref.bankBalance,
                  computedBalance: check.computedBalance, difference: check.difference,
                  txCount: check.txCount, status: check.status, causes };
    s.checks.unshift(rec);
    out.checks.push(rec);
  }
  return out;
}

function resolveCheck(s, checkId, note) {
  const c = s.checks.find((x) => x.id === checkId);
  if (!c) return;
  c.status = 'RESOLVED'; c.resolvedAt = new Date().toISOString(); c.resolutionNote = note || 'Resolvido manualmente';
}

/** Reconfere um saldo já registrado contra o estado atual (após corrigir lançamentos). */
function recheck(s, checkId) {
  const c = s.checks.find((x) => x.id === checkId);
  if (!c) return;
  const acc = accountById(s, c.accountId);
  if (!acc || acc.anchorBalance == null) return;
  const sysTxs = accTxs(s, c.accountId);
  const r = SFCore.runCheck({ anchorBalance: acc.anchorBalance, systemTxs: sysTxs, refDate: c.refDate, bankBalance: c.bankBalance });
  c.computedBalance = r.computedBalance; c.difference = r.difference; c.txCount = r.txCount;
  c.status = r.status;
  c.checkedAt = new Date().toISOString();
  c.causes = r.status === 'DIVERGENT' ? SFCore.diagnose({
    difference: r.difference, refDate: c.refDate, anchorBalance: acc.anchorBalance,
    systemTxs: sysTxs, statementTxs: [], excludedTxs: s.excluded.filter((e) => e.accountId === c.accountId),
  }) : [];
}

function rollbackBatch(s, batchId) {
  const batch = s.batches.find((b) => b.id === batchId && b.status === 'COMMITTED');
  if (!batch) return { removed: 0 };
  const affectedLinks = new Set(s.txs.filter((t) => t.batchId === batchId && t.linkId).map((t) => t.linkId));
  s.txs.forEach((t) => { if (affectedLinks.has(t.linkId)) t.linkId = null; });
  s.links = s.links.filter((l) => !affectedLinks.has(l.id));
  const before = s.txs.length;
  s.txs = s.txs.filter((t) => t.batchId !== batchId);
  s.checks = s.checks.filter((c) => c.batchId !== batchId);
  s.excluded = s.excluded.filter((e) => e.batchId !== batchId);
  const acc = accountById(s, batch.accountId);
  if (acc && acc.anchorBatchId === batchId) { acc.anchorBalance = null; acc.anchorDate = null; acc.anchorBatchId = null; }
  batch.status = 'ROLLED_BACK';
  s.checks.filter((c) => c.accountId === batch.accountId && c.status !== 'RESOLVED').forEach((c) => recheck(s, c.id));
  return { removed: before - s.txs.length };
}

/**
 * Reinicia uma conta do zero: apaga todos os lançamentos, vínculos de
 * transferência, histórico de conferência, importações e a âncora de saldo
 * dessa conta — para importar tudo de novo do começo. NÃO mexe em pessoas,
 * categorias, metas, investimentos cadastrados ou nas outras contas.
 */
function resetAccount(s, accountId) {
  const before = s.txs.filter((t) => t.accountId === accountId).length;
  const affectedLinks = new Set(s.txs.filter((t) => t.accountId === accountId && t.linkId).map((t) => t.linkId));
  s.txs.forEach((t) => { if (affectedLinks.has(t.linkId)) t.linkId = null; });
  s.links = s.links.filter((l) => !affectedLinks.has(l.id));
  s.txs = s.txs.filter((t) => t.accountId !== accountId);
  s.checks = s.checks.filter((c) => c.accountId !== accountId);
  s.excluded = s.excluded.filter((e) => e.accountId !== accountId);
  s.batches = s.batches.filter((b) => b.accountId !== accountId);
  const acc = accountById(s, accountId);
  if (acc) { acc.anchorBalance = null; acc.anchorDate = null; acc.anchorBatchId = null; acc.anchorFromUser = false; }
  return { removed: before };
}

/** Reinicia TODAS as contas de uma vez — mesma limpeza de resetAccount, em lote. */
function resetAllAccounts(s) {
  const before = s.txs.length;
  s.txs = [];
  s.links = [];
  s.checks = [];
  s.excluded = [];
  s.batches = [];
  s.accounts.forEach((acc) => { acc.anchorBalance = null; acc.anchorDate = null; acc.anchorBatchId = null; acc.anchorFromUser = false; });
  return { removed: before, accounts: s.accounts.length };
}

/**
 * Remove uma conta — só permitido se ela já estiver vazia (zero lançamentos).
 * Investimentos e metas que apontavam para ela ficam preservados, só perdem
 * o vínculo automático (viram valores fixos, editáveis manualmente).
 */
function removeAccount(s, accountId) {
  const acc = accountById(s, accountId);
  if (!acc) return { removed: false, reason: 'not_found' };
  const hasTx = s.txs.some((t) => t.accountId === accountId);
  if (hasTx) return { removed: false, reason: 'not_empty' };
  s.investments.forEach((i) => { if (i.accountId === accountId) i.accountId = null; });
  s.goals.forEach((g) => { if (g.accountId === accountId) { g.manualAmount = 0; g.accountId = null; } });
  s.checks = s.checks.filter((c) => c.accountId !== accountId);
  s.batches = s.batches.filter((b) => b.accountId !== accountId);
  s.accounts = s.accounts.filter((a) => a.id !== accountId);
  return { removed: true };
}

/**
 * Remove uma pessoa — só permitido se ela não tiver NENHUMA conta (nem
 * vazia). Exclua as contas dela primeiro (removeAccount, uma por uma).
 * Regra deliberadamente mais simples que "contas vazias podem ir junto":
 * cada exclusão (conta, depois pessoa) fica explícita e no controle do usuário.
 */
function removePerson(s, personId) {
  const accounts = s.accounts.filter((a) => a.ownerId === personId);
  if (accounts.length) {
    return { removed: false, reason: 'has_accounts', accountNames: accounts.map((a) => a.name) };
  }
  s.people = s.people.filter((p) => p.id !== personId);
  return { removed: true };
}

/** Desfaz a importação mais recente (a última da lista, de qualquer conta). */
function undoLastImport(s) {
  const last = s.batches.find((b) => b.status === 'COMMITTED');
  if (!last) return { removed: 0 };
  return rollbackBatch(s, last.id);
}

/* ───────── Lançamentos manuais: incluir, alterar, excluir (seção 15.9) ───────── */

/** Inclui um lançamento manual numa conta — mesma normalização de um importado. */
function addManualTx(s, accountId, { date, amount, description, categoryId }) {
  const canon = SFCore.toCanonical(date, amount, description);
  const hash = SFCore.makeHash(accountId, canon);
  const seqInDay = s.txs.filter((t) => t.accountId === accountId && t.hash === hash).length;
  const tx = {
    id: uid(), accountId, date: canon.date, amount: canon.amount,
    descriptionRaw: canon.descriptionRaw, descriptionNorm: canon.descriptionNorm, txType: canon.txType,
    counterpartyName: canon.counterpartyName || null, counterpartyDoc: canon.counterpartyDoc || null,
    categoryId: categoryId || SFCore.classify(canon, s.rules) || null, linkId: null,
    batchId: 'manual', hash, seqInDay, manual: true,
  };
  s.txs.push(tx);
  rematch(s);
  s.checks.filter((c) => c.accountId === accountId && c.status !== 'RESOLVED').forEach((c) => recheck(s, c.id));
  return tx;
}

/** Altera data, valor, descrição ou categoria de um lançamento já existente. */
function updateTx(s, txId, { date, amount, description, categoryId }) {
  const t = s.txs.find((x) => x.id === txId);
  if (!t) return null;
  const dateChanged = date !== undefined && date !== t.date;
  const amountChanged = amount !== undefined && amount !== t.amount;
  if (t.linkId && (dateChanged || amountChanged)) rejectLink(s, t.linkId); // só desfaz o vínculo se algo que afeta o pareamento mudou
  const canon = SFCore.toCanonical(date ?? t.date, amount ?? t.amount, description ?? t.descriptionRaw);
  t.date = canon.date; t.amount = canon.amount;
  t.descriptionRaw = canon.descriptionRaw; t.descriptionNorm = canon.descriptionNorm; t.txType = canon.txType;
  t.counterpartyName = canon.counterpartyName || null; t.counterpartyDoc = canon.counterpartyDoc || null;
  if (categoryId !== undefined) t.categoryId = categoryId || null;
  t.hash = SFCore.makeHash(t.accountId, canon);
  rematch(s);
  s.checks.filter((c) => c.accountId === t.accountId && c.status !== 'RESOLVED').forEach((c) => recheck(s, c.id));
  return t;
}

/** Exclui um único lançamento (e desfaz o vínculo de transferência, se houver). */
function deleteTx(s, txId) {
  const t = s.txs.find((x) => x.id === txId);
  if (!t) return { removed: false };
  if (t.linkId) rejectLink(s, t.linkId);
  s.txs = s.txs.filter((x) => x.id !== txId);
  s.checks.filter((c) => c.accountId === t.accountId && c.status !== 'RESOLVED').forEach((c) => recheck(s, c.id));
  return { removed: true, accountId: t.accountId };
}

function confirmLink(s, linkId) { const l = linkById(s, linkId); if (l) l.status = 'CONFIRMED'; }
function rejectLink(s, linkId) {
  const txs = s.txs.filter((t) => t.linkId === linkId);
  if (txs.length === 2) {
    const out = txs.find((t) => t.amount < 0), inn = txs.find((t) => t.amount > 0);
    if (out && inn) s.rejected.push(out.id + '|' + inn.id);
  }
  s.txs.forEach((t) => { if (t.linkId === linkId) t.linkId = null; });
  s.links = s.links.filter((l) => l.id !== linkId);
}

/* ───────── Consultor de Investimentos de Baixo Risco (seção 10) ───────── */

const today = () => new Date().toISOString().slice(0, 10);

/** Sugere um investimento a partir de uma conta do tipo cofrinho/investimento já existente. */
function investmentFromAccount(s, acc) {
  const txs = s.txs.filter((t) => t.accountId === acc.id).sort((a, b) => a.date.localeCompare(b.date));
  if (!txs.length) return null;
  const applied = txs.filter((t) => t.amount > 0).reduce((x, t) => x + t.amount, 0);
  return {
    id: uid(), accountId: acc.id, institution: acc.institution,
    type: acc.type === 'COFRINHO' ? 'COFRINHO' : acc.type === 'POUPANCA' ? 'POUPANCA' : 'CDB',
    appliedAt: txs[0].date, appliedAmount: applied || balance(s, acc),
    currentBalance: balance(s, acc), liquidity: 'DIARIA',
    index: acc.type === 'POUPANCA' ? 'POUPANCA' : 'CDI',
    pctOfIndex: acc.type === 'POUPANCA' ? undefined : 1.0,
    fgc: true, fromAccount: true,
  };
}

/** Saldo atual sincronizado com a conta vinculada, quando houver. */
function syncedInvestment(s, inv) {
  if (!inv.accountId) return inv;
  const acc = accountById(s, inv.accountId);
  return acc ? { ...inv, currentBalance: balance(s, acc) } : inv;
}

function investmentReport(s) {
  const t = today();
  const list = s.investments.map((i) => syncedInvestment(s, i));
  const rows = list.map((inv) => ({ inv, perf: SFCore.performance(inv, s.market, t) }));
  const totalApplied = rows.reduce((x, r) => x + r.inv.appliedAmount, 0);
  const totalBalance = rows.reduce((x, r) => x + r.inv.currentBalance, 0);
  return {
    rows, totalApplied, totalBalance, totalGain: totalBalance - totalApplied,
    fgc: SFCore.fgcExposure(list),
    freshness: SFCore.dataFreshness(s.market, t),
    market: s.market,
  };
}

/** Compara um investimento do usuário com as opções de mercado cadastradas. */
function compareInvestment(s, investmentId, horizonDays, principalOverride) {
  const inv = syncedInvestment(s, s.investments.find((i) => i.id === investmentId));
  if (!inv) return null;
  const principal = principalOverride || inv.currentBalance;
  const options = SFCore.filterConservative(s.marketOptions);
  const comparisons = SFCore.compareOptions(
    principal,
    { index: inv.index, pctOfIndex: inv.pctOfIndex, preRate: inv.preRate, type: inv.type, liquidity: inv.liquidity },
    options, s.market, horizonDays,
  );
  return { inv, principal, horizonDays, comparisons, current: SFCore.project(principal, inv, s.market, horizonDays) };
}

/** Simulador livre: quanto rende X por N meses a Y% do CDI. */
function simulate(s, principal, months, index, pctOfIndex, type) {
  const days = Math.round(months * 30.4375);
  return SFCore.project(principal, { index, pctOfIndex, type: type || 'CDB' }, s.market, days);
}

/* ───────── Fase 2 — previsto × realizado (seções 8 e 2) ───────── */

/** Faturas ainda não quitadas viram compromissos a pagar, para aparecerem no
 *  calendário e na projeção. Some sozinho quando a fatura é paga. */
function cardPlannedItems(s) {
  const out = [];
  for (const card of s.accounts.filter(isCard)) {
    for (const inv of invoicesOf(s, card)) {
      if (inv.remaining <= 0) continue;
      if (inv.status === 'FUTURA') continue;   // ainda pode mudar até fechar
      out.push({
        id: 'fatura-' + card.id + '-' + inv.key,
        description: `Fatura ${card.name}`,
        kind: 'A_PAGAR', expectedAmount: inv.remaining,
        dueDate: inv.dueDate,
        status: inv.dueDate < today() ? 'ATRASADO' : 'PREVISTO',
        installmentInfo: null, recurringKey: null, virtual: true,
      });
    }
  }
  return out;
}
/** Compromissos reais + faturas em aberto. */
function plannedWithCards(s) { return [...s.planned, ...cardPlannedItems(s)]; }

function planTxs(s) {
  // compras no cartão não são saída de dinheiro na data da compra — o caixa só
  // é afetado no pagamento da fatura, que entra como compromisso a pagar
  const cardIds = new Set(s.accounts.filter(isCard).map((a) => a.id));
  return s.txs.filter((t) => !cardIds.has(t.accountId)).map((t) => ({
    id: t.id, date: t.date, amount: t.amount, descriptionNorm: t.descriptionNorm,
    descriptionRaw: t.descriptionRaw, categoryId: t.categoryId, linkId: t.linkId, txType: t.txType,
  }));
}

/** Recorrências detectadas no histórico, ignorando as que o usuário dispensou. */
function recurringItems(s) {
  const dismissed = new Set(s.dismissedRecurring || []);
  return SFCore.detectRecurring(planTxs(s)).filter((r) => !dismissed.has(r.key));
}

/** Roda a conciliação previsto → realizado e atualiza os status. */
function syncPlanned(s) {
  const r = SFCore.reconcilePlanned(s.planned, planTxs(s), today());
  for (const m of r.matched) {
    const p = s.planned.find((x) => x.id === m.plannedId);
    if (p) { p.status = 'REALIZADO'; p.realizedTxId = m.txId; p.realizedAmount = m.amount; }
  }
  for (const id of r.overdue) {
    const p = s.planned.find((x) => x.id === id);
    if (p && p.status !== 'REALIZADO') p.status = 'ATRASADO';
  }
  for (const id of r.stillPlanned) {
    const p = s.planned.find((x) => x.id === id);
    if (p && p.status === 'ATRASADO') p.status = 'PREVISTO';
  }
  return r;
}

/** Posição atual por pessoa: em conta, aplicado e total. */
function positionByPerson(s) {
  const rows = s.people.map((p) => {
    const accs = s.accounts.filter((a) => a.ownerId === p.id);
    const invested = accs.filter((a) => INVESTED_TYPES.includes(a.type)).reduce((x, a) => x + balance(s, a), 0);
    const inAccounts = accs.filter((a) => !INVESTED_TYPES.includes(a.type)).reduce((x, a) => x + balance(s, a), 0);
    return { person: p, inAccounts, invested, total: inAccounts + invested };
  });
  const family = rows.reduce((acc, r) => ({
    inAccounts: acc.inAccounts + r.inAccounts, invested: acc.invested + r.invested, total: acc.total + r.total,
  }), { inAccounts: 0, invested: 0, total: 0 });
  return { rows, family };
}

function consolidatedView(s, monthsBack, monthsAhead) {
  syncPlanned(s);
  const pos = positionByPerson(s);
  const rows = SFCore.consolidated({
    txs: planTxs(s), planned: plannedWithCards(s), recurring: recurringItems(s),
    netWorthNow: pos.family.total, today: today(),
    monthsBack: monthsBack ?? 3, monthsAhead: monthsAhead ?? 8,
  });
  return { position: pos, months: rows, recurring: recurringItems(s),
           overdue: s.planned.filter((p) => p.status === 'ATRASADO'),
           upcoming: s.planned.filter((p) => p.status === 'PREVISTO' && p.dueDate >= today())
             .sort((x, y) => x.dueDate.localeCompare(y.dueDate)).slice(0, 8) };
}

function addPlanned(s, entry, installments) {
  const base = { description: entry.description, kind: entry.kind, dueDate: entry.dueDate,
                 expectedAmount: entry.expectedAmount, categoryId: entry.categoryId || null,
                 accountId: entry.accountId || null, recurringKey: entry.recurringKey || null };
  if (installments && installments > 1) {
    s.planned.push(...SFCore.generateInstallments(base, installments, uid));
  } else {
    s.planned.push({ ...base, id: uid(), installmentInfo: null, status: 'PREVISTO' });
  }
  syncPlanned(s);
}

/** Transforma uma recorrência detectada em compromissos dos próximos meses. */
function promoteRecurring(s, key, months) {
  const r = recurringItems(s).find((x) => x.key === key);
  if (!r) return 0;
  const start = SFCore.monthOf(today());
  let added = 0;
  for (let i = 0; i < (months || 6); i++) {
    const ym = SFCore.addMonths(start, i);
    const day = String(Math.min(r.dayOfMonth, 28)).padStart(2, '0');
    const dueDate = `${ym}-${day}`;
    if (dueDate < today() && i === 0) continue;
    if (s.planned.some((p) => p.recurringKey === key && p.dueDate.slice(0, 7) === ym)) continue;
    s.planned.push({ id: uid(), description: r.label, kind: r.avgAmount >= 0 ? 'A_RECEBER' : 'A_PAGAR',
      dueDate, expectedAmount: Math.abs(r.avgAmount), categoryId: r.categoryId, accountId: null,
      recurringKey: key, installmentInfo: null, status: 'PREVISTO' });
    added++;
  }
  syncPlanned(s);
  return added;
}

/* ───────── Fase 2B — orçamento, metas, evolução e relatórios ───────── */

function budgetLines(s) {
  const ipcaAnnual = (s.market && s.market.ipca12m) || 0;
  const monthlyInflation = Math.pow(1 + ipcaAnnual, 1 / 12) - 1;
  return SFCore.categoryBudgets(planTxs(s), today(), 6, monthlyInflation)
    .map((l) => ({ ...l, name: l.categoryId === 'sem-categoria' ? 'Sem categoria' : catName(s, l.categoryId) || l.categoryId }));
}

function netWorthHistory(s, months) {
  const accounts = s.accounts.map((a) => ({
    id: a.id, anchorBalance: a.anchorBalance || 0,
    isInvested: INVESTED_TYPES.includes(a.type), ownerId: a.ownerId,
  }));
  return SFCore.netWorthSeries(accounts, s.txs.map((t) => ({ accountId: t.accountId, date: t.date, amount: t.amount })), today(), months || 12);
}

function goalRows(s) {
  return s.goals.map((g) => {
    const acc = g.accountId ? accountById(s, g.accountId) : null;
    const current = acc ? balance(s, acc) : (g.manualAmount || 0);
    const aportes = acc ? s.txs.filter((t) => t.accountId === acc.id && t.amount > 0).map((t) => ({ date: t.date, amount: t.amount })) : [];
    return { goal: g, account: acc, progress: SFCore.goalProgress(g, current, aportes, today()) };
  });
}

function reportBreakdown(s, dimension, fromMonth, toMonth) {
  const keyOf = dimension === 'conta'
    ? (t) => { const a = accountById(s, t.accountId); return a ? a.name : 'conta removida'; }
    : dimension === 'pessoa'
    ? (t) => { const a = accountById(s, t.accountId); return a ? personName(s, a.ownerId) : '?'; }
    : (t) => (t.categoryId ? catName(s, t.categoryId) : 'Sem categoria');
  const txs = planTxs(s).map((t, i) => ({ ...t, accountId: s.txs[i].accountId }));
  return SFCore.breakdown(txs, keyOf, fromMonth, toMonth);
}

/* ───────── Fase 2C — calendário financeiro ───────── */

function calendarFor(s, month) {
  syncPlanned(s);
  const accounts = s.accounts.map((x) => ({ id: x.id, anchorBalance: x.anchorBalance || 0 }));
  const txsForBalance = s.txs.map((t) => ({ accountId: t.accountId, date: t.date, amount: t.amount }));
  const startBalance = SFCore.balanceBeforeMonth(accounts, txsForBalance, month);
  return SFCore.calendarMonth(month, planTxs(s), plannedWithCards(s), { today: today(), startBalance });
}

/** Linhas do extrato prontas para planilha. */
function exportRows(s) {
  return s.txs.slice().sort((x, y) => x.date.localeCompare(y.date)).map((t) => {
    const a = accountById(s, t.accountId);
    return {
      Data: t.date, Conta: a ? a.name : '', Titular: a ? personName(s, a.ownerId) : '',
      Descricao: t.descriptionRaw, Tipo: t.txType,
      Categoria: t.categoryId ? catName(s, t.categoryId) : '',
      Valor: (t.amount / 100).toFixed(2).replace('.', ','),
      TransferenciaInterna: t.linkId ? 'sim' : 'nao',
    };
  });
}

/* ───────── Leitor autocalibrável de extratos (seção 12) ───────── */

/**
 * Lê um extrato testando as interpretações possíveis e escolhendo a que reproduz
 * os saldos impressos pelo banco. Se já existe um perfil salvo para a instituição,
 * ele entra na disputa com vantagem — mas só vence se também fechar.
 */
function readStatement(s, institution, lines, expectedClosing) {
  const result = SFCore.autoCalibrate(lines, expectedClosing);
  const saved = s.layoutProfiles[institution];
  if (saved) {
    try {
      const withSaved = SFCore.parseStatementWithBalances(lines, saved.strategy);
      // o perfil salvo só prevalece se produzir ao menos tantos lançamentos quanto o automático
      if (withSaved.txs.length >= result.parsed.txs.length && result.confidence < 1) {
        return { ...result, parsed: withSaved, strategy: saved.strategy, usedProfile: true };
      }
    } catch (e) { /* perfil inválido: segue com o automático */ }
  }
  return { ...result, usedProfile: false };
}

/** Guarda a forma de ler os extratos deste banco para as próximas importações. */
function saveLayoutProfile(s, institution, strategy, confidence) {
  s.layoutProfiles[institution] = {
    strategy, confidence, learnedAt: today(),
  };
}
function forgetLayoutProfile(s, institution) { delete s.layoutProfiles[institution]; }
/** Chave de perfil de leitura: bancos não listados usam o nome próprio informado pela pessoa,
 *  em vez de todos dividirem o mesmo balde "OUTRO" (o que faria um banco atrapalhar a leitura do outro). */
function layoutProfileKey(institution, customBankName) {
  if (institution !== 'OUTRO') return institution || 'OUTRO';
  const nome = (customBankName || '').trim();
  return nome ? 'OUTRO:' + nome.toUpperCase() : 'OUTRO';
}

/* ───────── Identificação da conta pelo conteúdo do arquivo (seção 13) ───────── */

function accountRefs(s) {
  return s.accounts.map((a) => ({
    id: a.id, name: a.name, institution: a.institution,
    agency: a.agency || null, number: a.number || null,
    ownerName: personName(s, a.ownerId),
    ownerDoc: (s.people.find((p) => p.id === a.ownerId) || {}).doc || null,
  }));
}

/** De qual conta é este arquivo? Roda ANTES de qualquer gravação. */
function resolveStatementAccount(s, lines) {
  return SFCore.resolveAccount(lines, accountRefs(s));
}

/** Confere a conta escolhida contra o que o arquivo diz. CONFLITO impede a importação. */
function verifyAccountChoice(s, accountId, identity) {
  const a = accountById(s, accountId);
  if (!a) return { verdict: 'CONFLITO', reasons: ['Conta não encontrada.'], detected: identity };
  return SFCore.checkIdentity(identity, {
    institution: a.institution, name: a.name, agency: a.agency || null, number: a.number || null,
    ownerDoc: (s.people.find((p) => p.id === a.ownerId) || {}).doc || null,
  });
}

/** Depois de uma importação confirmada, a conta guarda agência/número para as próximas. */
function learnAccountIdentity(s, accountId, identity) {
  const a = accountById(s, accountId);
  if (!a || !identity) return;
  if (!a.number && identity.account) a.number = identity.account;
  if (!a.agency && identity.agency) a.agency = identity.agency;
  const person = s.people.find((p) => p.id === a.ownerId);
  if (person && !person.doc && identity.doc) person.doc = identity.doc;
}

/* ───────── Fase 3 — Consultor Financeiro (camada estatística) ───────── */

function advisorInputs(s) {
  syncPlanned(s);
  const pos = positionByPerson(s);
  const budgets = budgetLines(s);
  const overdue = s.planned.filter((p) => p.status === 'ATRASADO');
  const upcoming = s.planned.filter((p) => p.status === 'PREVISTO' && p.dueDate >= today())
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const invPerfs = s.investments.map((i) => syncedInvestment(s, i))
    .map((i) => ({ institution: i.institution, type: i.type, perf: SFCore.performance(i, s.market, today()), pctOfIndex: i.pctOfIndex }));
  const fgc = SFCore.fgcExposure(s.investments.map((i) => syncedInvestment(s, i)));
  const accountsReview = s.accounts.filter((a) => accountStatus(s, a) === 'NECESSITA_CONFERENCIA').length;
  const goalsOff = goalRows(s).filter((g) => !g.progress.reached && !g.progress.onTrack && g.progress.monthlyNeeded != null)
    .map((g) => ({ name: g.goal.name, monthlyNeeded: g.progress.monthlyNeeded, avgMonthlyContribution: g.progress.avgMonthlyContribution, forecastMonth: g.progress.forecastMonth }));
  const liquidBalance = s.accounts.filter((a) => !INVESTED_TYPES.includes(a.type)).reduce((x, a) => x + balance(s, a), 0);
  const hasLiquidInvestment = s.investments.some((i) => i.liquidity === 'DIARIA' && syncedInvestment(s, i).currentBalance > 0)
    || s.accounts.some((a) => INVESTED_TYPES.includes(a.type) && balance(s, a) > 0);
  const avgMonthlyResult = advisorProjection(s, [1]).basis.avgMonthlyResult;

  return {
    today: today(), netWorth: pos.family.total, budgets,
    overduePlanned: overdue, upcomingPlanned: upcoming, investmentPerfs: invPerfs,
    fgcExposure: fgc.map((f) => ({ institution: f.institution, uncovered: f.uncovered })),
    accountsNeedingReview: accountsReview, goalsOffTrack: goalsOff, liquidBalance,
    hasLiquidInvestment, avgMonthlyResult,
  };
}

function advisorInsights(s) {
  return SFCore.generateInsights(advisorInputs(s));
}

function advisorProjection(s, horizons) {
  const serie = netWorthHistory(s, 12).map((p) => p.total);
  const results = serie.length >= 2 ? serie.slice(1).map((v, i) => v - serie[i]) : [];
  return SFCore.projectNetWorth(serie.length ? serie[serie.length - 1] : 0, results, today(), horizons || [3, 6, 12, 24]);
}

function advisorDebtVsInvest(s, opts) {
  return SFCore.debtVsInvest({
    principal: opts.principal, debtAnnualRate: opts.debtAnnualRate, debtRemainingMonths: opts.debtRemainingMonths,
    invest: { index: s.market, pctOfIndex: opts.pctOfIndex, productType: 'CDB' }, horizonMonths: opts.horizonMonths,
  });
}

function advisorSummaryText(s) {
  const input = advisorInputs(s);
  const insights = advisorInsights(s);
  return SFCore.buildAdvisorSummary(input, insights);
}

/* ───────── Limpeza retroativa de duplicatas (bug de hash corrigido) ───────── */

function duplicateClustersFor(s, accountId) {
  const txs = s.txs.filter((t) => t.accountId === accountId)
    .map((t) => ({ id: t.id, date: t.date, amount: t.amount, descriptionRaw: t.descriptionRaw, descriptionNorm: t.descriptionNorm, batchId: t.batchId }));
  return SFCore.findLikelyDuplicates(txs);
}

function allDuplicateClusters(s) {
  const byAccount = {};
  for (const a of s.accounts) {
    const clusters = duplicateClustersFor(s, a.id);
    if (clusters.length) byAccount[a.id] = clusters;
  }
  return byAccount;
}

/** Remove as transações indicadas (mantendo a mais antiga de cada grupo) e reconcilia tudo depois. */
function removeDuplicateTx(s, txIds) {
  const set = new Set(txIds);
  const affectedLinks = new Set(s.txs.filter((t) => set.has(t.id) && t.linkId).map((t) => t.linkId));
  s.txs.forEach((t) => { if (affectedLinks.has(t.linkId)) t.linkId = null; });
  s.links = s.links.filter((l) => !affectedLinks.has(l.id));
  const before = s.txs.length;
  s.txs = s.txs.filter((t) => !set.has(t.id));
  const removed = before - s.txs.length;
  rematch(s);
  // reconfere os saldos das contas afetadas, já que a soma das transações mudou
  const affectedAccounts = new Set(s.checks.map((c) => c.accountId));
  s.checks.filter((c) => c.status !== 'RESOLVED').forEach((c) => recheck(s, c.id));
  return removed;
}

/** Registra o pagamento (total ou parcial) de uma fatura.
 *  Gera dois lançamentos vinculados: saída na conta e abatimento no cartão.
 *  Por serem vinculados, não entram no fluxo real — a despesa já foi a compra. */

  } else if (checkTotal != null) {
    confidence = 0.4;
    diagnostics.push(`Atenção: os lançamentos lidos somam ${SFCore.formatBRL(sumCurrent)}, mas a fatura informa ${SFCore.formatBRL(checkTotal)} em lançamentos atuais. Confira os lançamentos antes de importar.`);
  } else {
    confidence = 0.3;
    diagnostics.push('Não encontrei o total impresso da fatura para conferir a leitura. Confira os lançamentos antes de importar.');
  }
  if (nettedPairs > 0) {
    diagnostics.push(`${nettedPairs} lançamento(s) e seu(s) cancelamento(s) na mesma fatura (total de ${SFCore.formatBRL(nettedTotal)}) se anularam e não entram na importação.`);
  }
  if (demaisFaturasTotal) {
    diagnostics.push(`Há ainda ${SFCore.formatBRL(demaisFaturasTotal)} em parcelas de faturas mais à frente, não detalhadas nesta fatura — serão importadas quando a fatura seguinte chegar.`);
  }

  const txsCurrent = currentEntries.map((e) => {
    const refDate = closingDate || SFCore.brDateToISO(`${e.dateBr}/${inferInvoiceYear(e.dateBr, dueDate)}`) || dueDate;
    return SFCore.toCanonical(refDate, -e.valueCents, e.descRaw);
  });
  const txsFuture = futureEntries.map((e) => SFCore.toCanonical(nextClosingDate || dueDate, -e.valueCents, e.descRaw));

  return {
    txs: [...txsCurrent, ...txsFuture],
    dailyBalances: [],
    meta: { hasBalances: false, totalFatura, totalLancamentosAtuais, dueDate, nextClosingDate, demaisFaturasTotal, proximaFaturaTotal },
    calibration: { trustworthy: confidence >= 0.99, confidence, diagnostics, strategy: null, isInvoice: true },
  };
}

/* ───────── Leitor genérico de fatura (qualquer banco) ─────────
   Não depende de frases específicas de um emissor: reconhece a ESTRUTURA
   (linha com data + descrição + valor terminado em +/-) e valida contra
   qualquer um dos jeitos comuns de imprimir o total da fatura. Usado quando
   o leitor específico do Itaú não reconhece o arquivo. */
function looksLikeAnyInvoice(lines) {
  const head = normNoSpace(lines.slice(0, 60).join(' '));
  return head.includes('FATURA') && (head.includes('CARTAO') || head.includes('VENCIMENTO'));
}
const GENERIC_TOTAL_KEYWORDS = [
  'TOTALDESTAFATURA', 'SALDODESTAFATURA', 'SALDOAPAGAR', 'TOTALAPAGAR',
  'VALORTOTALDAFATURA', 'DESPESASDEBITOSNOBRASIL', 'TOTALDAFATURA',
];
const GENERIC_ENTRY_RE = new RegExp(
  '^(\\d{2}\\/\\d{2}(?:\\/\\d{2,4})?)\\s+([^\\n]*?)([+-]\\s?' + MONEY_LOOSE_SRC.replace('-?', '') + ')\\s*$',
);
function parseGenericInvoiceLines(lines) {
  const full = lines.join('\n');
  const fullFlat = normNoSpace(full);
  let checkTotal = null;
  for (const kw of GENERIC_TOTAL_KEYWORDS) {
    checkTotal = moneyAfterKeyword(fullFlat, kw);
    if (checkTotal != null) break;
  }
  const dueDate = dateAfterKeyword(fullFlat, 'VENCIMENTO:') || dateAfterKeyword(fullFlat, 'VENCIMENTO', 200);
  if (!dueDate) return null; // nem a data de vencimento achou — não parece mesmo uma fatura

  const rawEntries = [];
  lines.forEach((line, i) => {
    const m = line.trim().match(GENERIC_ENTRY_RE);
    if (!m) return;
    const descNorm = normNoSpace(m[2]);
    if (/PAGAMENTO|PAGTO|CREDITOEMCONTA/.test(descNorm)) return; // pagamento da fatura, não é despesa
    const sign = m[3].trim().startsWith('-') ? -1 : 1;
    const value = SFCore.parseMoney(m[3].replace(/[+\s]/g, ''));
    rawEntries.push({ dateBr: m[1], descRaw: m[2].replace(/\s+/g, ' ').trim(), valueCents: sign * Math.abs(value), lineIndex: i });
  });

  // anula pares de valor exatamente oposto (compra + cancelamento na mesma fatura)
  const groups = new Map();
  rawEntries.forEach((e, idx) => {
    const abs = Math.abs(e.valueCents);
    if (!groups.has(abs)) groups.set(abs, []);
    groups.get(abs).push({ idx, sign: Math.sign(e.valueCents) });
  });
  const netted = new Set();
  let nettedTotal = 0, nettedPairs = 0;
  for (const [abs, arr] of groups) {
    const pos = arr.filter((x) => x.sign > 0), neg = arr.filter((x) => x.sign < 0);
    const n = Math.min(pos.length, neg.length);
    for (let i = 0; i < n; i++) { netted.add(pos[i].idx); netted.add(neg[i].idx); nettedTotal += abs; nettedPairs++; }
  }
  const survivors = rawEntries.filter((e, idx) => !netted.has(idx) && e.descRaw);
  if (!survivors.length) return null; // não achou nenhum lançamento reconhecível

  // todo lançamento desta fatura cai no mesmo ciclo (perto do fechamento, ~7 dias antes
  // do vencimento) — a data original impressa pode ser de semanas atrás e não deve
  // criar uma fatura fantasma num mês passado.
  const dueDateObj = new Date(dueDate + 'T00:00:00');
  dueDateObj.setDate(dueDateObj.getDate() - 7);
  const refDate = dueDateObj.toISOString().slice(0, 10);

  const sum = survivors.reduce((a, e) => a + e.valueCents, 0);
  const diagnostics = [];
  let confidence;
  if (checkTotal != null && sum === checkTotal) {
    confidence = 1;
    diagnostics.push(`Os lançamentos lidos somam ${SFCore.formatBRL(sum)}, batendo com o total desta fatura.`);
  } else if (checkTotal != null) {
    confidence = 0.4;
    diagnostics.push(`Atenção: os lançamentos lidos somam ${SFCore.formatBRL(sum)}, mas a fatura informa ${SFCore.formatBRL(checkTotal)}. Confira os lançamentos antes de importar.`);
  } else {
    confidence = 0.3;
    diagnostics.push('Não encontrei um total impresso para conferir a leitura. Confira os lançamentos antes de importar.');
  }
  if (nettedPairs > 0) {
    diagnostics.push(`${nettedPairs} lançamento(s) e seu(s) cancelamento(s) na mesma fatura (total de ${SFCore.formatBRL(nettedTotal)}) se anularam e não entram na importação.`);
  }
  diagnostics.push('Leitura genérica (formato de fatura ainda não catalogado) — revise com atenção antes de confirmar.');

  const txs = survivors.map((e) => SFCore.toCanonical(refDate, -e.valueCents, e.descRaw));

  return {
    txs, dailyBalances: [],
    meta: { hasBalances: false, totalFatura: checkTotal, dueDate },
    calibration: { trustworthy: confidence >= 0.99, confidence, diagnostics, strategy: null, isInvoice: true },
  };
}

async function parseAnyFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')) {
    const lines = await pdfToLines(await file.arrayBuffer());
    const buildInvoiceResult = (invoice, institutionGuess) => {
      const cards = S.accounts.filter(isCard);
      const resolution = {
        identity: institutionGuess ? { institution: institutionGuess } : {},
        matches: cards.map((a) => ({ account: a, score: 100, reasons: [] })),
        best: cards[0] ? { account: cards[0], score: 100, reasons: [] } : null,
        confident: cards.length === 1,
        summary: cards.length
          ? `Fatura de cartão de crédito identificada${invoice.meta.totalFatura != null ? `, total de ${SFCore.formatBRL(invoice.meta.totalFatura)}` : ''}.`
          : 'Fatura de cartão identificada, mas nenhum cartão está cadastrado. Cadastre em Mais → Contas.',
      };
      return { txs: invoice.txs, dailyBalances: invoice.dailyBalances, meta: invoice.meta,
                lines, calibration: invoice.calibration, resolution };
    };
    if (looksLikeCardInvoice(lines)) {
      const invoice = parseCardInvoiceLines(lines);
      if (invoice && invoice.txs.length) return buildInvoiceResult(invoice, 'ITAU');
    }
    if (looksLikeAnyInvoice(lines)) {
      const invoice = parseGenericInvoiceLines(lines);
      if (invoice && invoice.txs.length) return buildInvoiceResult(invoice, null);
    }
    const resolution = resolveStatementAccount(S, lines);
    const read = readStatement(S, layoutProfileKey(resolution.identity.institution || 'OUTRO', null), lines);
    if (!read.parsed.txs.length) {
      throw new Error('Nenhum lançamento reconhecido neste PDF. Se ele for uma imagem digitalizada, o texto não pode ser lido — peça ao banco a versão em PDF de texto, CSV ou OFX.');
    }
    return { ...read.parsed, lines, calibration: read, resolution };
  }
  const text = await file.text();
  if (name.endsWith('.ofx') || /<OFX/i.test(text)) {
    const r = SFCore.parseOfxWithBalances(text);
    if (!r.txs.length) throw new Error('OFX sem lançamentos reconhecíveis.');
    return r;
  }
  let txs = [];
  try { txs = SFCore.parseNubankCsv(text); } catch (e) {}
  if (!txs.length) txs = parseGenericCsv(text);
  if (!txs.length) throw new Error('Não consegui ler lançamentos deste arquivo.');
  // mesmo em CSV/OFX vale procurar a assinatura do banco no conteúdo
  const resolution = resolveStatementAccount(S, text.split('\n'));
  return { txs, meta: { hasBalances: false }, dailyBalances: [], resolution }; // CSV de conta não informa saldo
}

// ───────── views ─────────
function txRow(t) {
  const a = accountById(S, t.accountId);
  return `<div class="row">
    <div class="grow">
      <div class="desc">${esc(t.descriptionRaw)}</div>
      <div class="sub">${fmtDate(t.date)} · ${esc(a ? a.name : '')}${t.categoryId ? ' · ' + esc(catName(S, t.categoryId)) : ''}</div>
    </div>
    ${t.linkId ? '<span class="chip neutral-chip">⇄ Interna</span>' : ''}
    <div class="amt ${amountCls(t)}">${fmtBRL(t.amount)}</div>
  </div>`;
}
