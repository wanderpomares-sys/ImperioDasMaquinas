function render() {
  // enquanto o código de recuperação ainda não foi confirmado, essa tela tem prioridade
  // sobre o app normal — mesmo já com o cofre criado e desbloqueado.
  if (setupStep > 0) { trackScreen('codigo_recuperacao'); document.body.classList.add('locked'); $('#view').innerHTML = viewSetup(); return; }
  // nada sensível aparece antes da autenticação
  if (!S || !SFSec.isUnlocked()) { bootScreen(); return; }
  if (isLicenseExpired()) { trackScreen('paywall_anual'); document.body.classList.add('locked'); $('#view').innerHTML = viewLicenseExpired(); return; }
  if (isTrialExpiredNoLicense()) { trackScreen('paywall_avaliacao'); document.body.classList.add('locked'); $('#view').innerHTML = viewTrialExpired(); return; }
  document.body.classList.remove('locked');
  trackScreen('tab:' + tab);
  const views = { inicio: viewInicio, importar: viewImportar, extrato: viewExtrato, contas: viewContas,
                  auditoria: viewAuditoria, investir: viewInvestir, cartoes: viewCartoes, seguranca: viewSeguranca, consolidado: viewConsolidado, relatorios: viewRelatorios, calendario: viewCalendario, consultor: viewConsultor, mais: viewMais };
  const health = SFSec.saveHealth();
  tutorialChecarProgresso();
  $('#view').innerHTML =
    viewAtualizacaoBanner()
    + viewAvaliacaoBanner()
    + (storageOk ? '' : '<div class="error">Este navegador não permitiu salvar dados (modo de visualização?). Baixe o arquivo e abra direto no navegador do seu computador ou celular.</div>')
    + (health.error ? `<div class="error"><b>Seus dados NÃO foram salvos.</b><br>${esc(health.error)}</div>` : '')
    + views[tab]() + viewAuthModal() + viewTutorialOverlay();
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  syncEyeIcon();
  tutorialAplicarDestaque();
}

/** Faz uma gravação de verdade e confirma, na hora, se funcionou. */
async function testarGravacao() {
  try {
    SFSec.scheduleSave(S);
    await SFSec.flushSave();
    const h = SFSec.saveHealth();
    if (h.error) { alert('FALHOU\n\n' + h.error); }
    else {
      // conferir relendo do armazenamento
      const raw = localStorage.getItem('sf-vault-v1');
      const ok = !!raw && (JSON.parse(raw).rev || 0) === h.rev;
      alert(ok
        ? `Gravação OK.\n\nVersão: ${h.rev}\nLançamentos: ${S.txs.length}\nContas: ${S.accounts.length}\nTamanho: ${(raw.length/1024).toFixed(0)} KB`
        : 'ATENÇÃO: gravou, mas ao reler o dado não confere. O navegador pode estar descartando o armazenamento.');
    }
  } catch (e) {
    alert('FALHOU\n\n' + (e && e.message ? e.message : 'erro desconhecido'));
  }
  render();
}

/** Garante que qualquer alteração pendente seja gravada antes de o app sair de cena. */
function flushPendingSave() {
  try { SFSec.flushSave(); } catch (e) { /* cofre já bloqueado ou sem alterações */ }
}

window.addEventListener('DOMContentLoaded', () => {
  ['click', 'keydown', 'touchstart', 'scroll'].forEach((ev) =>
    document.addEventListener(ev, touchActivity, { passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flushPendingSave(); checkAutoLock(); try { SFTelemetry.flush(); } catch (e) {} }
  });
  window.addEventListener('pagehide', flushPendingSave);
  window.addEventListener('beforeunload', flushPendingSave);
  try { SFTelemetry.track('session_start', sessionInfo()); SFTelemetry.flush(); } catch (e) {}
  limparServiceWorkerAntigo();
  setTimeout(checarAtualizacaoApp, 2000); // espera a tela principal carregar antes de checar
  bootScreen();
});

const SF_SUPABASE_URL = 'https://ibfghedgyxvyredykluq.supabase.co';
const SF_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliZmdoZWRneXh2eXJlZHlrbHVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjU2NjQsImV4cCI6MjEwNTM0MTY2NH0.Limb3hOXYNjHrBqZDMojQL77s7dqp49GOve3MbM_8tk';

const SFTelemetry = (() => {
  const DEVICE_KEY = 'sf-device-id';
  const QUEUE_KEY = 'sf-events-queue';
  const FLAGS_KEY = 'sf-telemetry-flags';

  function getDeviceId() {
    let id;
    try { id = localStorage.getItem(DEVICE_KEY); } catch (e) { return null; }
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      try { localStorage.setItem(DEVICE_KEY, id); } catch (e) {}
    }
    return id;
  }
  function getFlags() {
    try { return JSON.parse(localStorage.getItem(FLAGS_KEY) || '{}'); } catch (e) { return {}; }
  }
  function setFlag(name) {
    try { const f = getFlags(); f[name] = true; localStorage.setItem(FLAGS_KEY, JSON.stringify(f)); } catch (e) {}
  }
  function hasFlag(name) { return !!getFlags()[name]; }

  function queue(event, extra) {
    try {
      const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      q.push({ event, extra: extra || null, ts: Date.now() });
      while (q.length > 200) q.shift();
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
    } catch (e) {}
  }

  async function flush() {
    try {
      const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      if (!q.length) return;
      if (!SF_SUPABASE_URL.startsWith('http') || !SF_SUPABASE_ANON_KEY) return;
      const deviceId = getDeviceId();
      const rows = q.map((e) => ({
        device: deviceId, event: e.event, extra: e.extra, created_at: new Date(e.ts).toISOString()
      }));
      const res = await fetch(`${SF_SUPABASE_URL}/rest/v1/events`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SF_SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SF_SUPABASE_ANON_KEY}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(rows),
        keepalive: true
      });
      if (res.ok) localStorage.removeItem(QUEUE_KEY);
    } catch (e) {}
  }

  function track(event, extra) { queue(event, extra); }
  function trackOnce(event, extra) { if (hasFlag(event)) return; setFlag(event); queue(event, extra); }

  return { track, trackOnce, flush, getDeviceId };
})();
