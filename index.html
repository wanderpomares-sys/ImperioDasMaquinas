function guiaPassos() {
  return [
    { ok: S.people.length > 0, txt: 'Cadastrar quem vai usar (você e a família)' },
    { ok: S.accounts.length > 0, txt: 'Cadastrar uma conta (ex.: conta corrente)' },
    { ok: S.txs.length > 0, txt: 'Lançar um gasto ou importar um extrato' },
  ];
}
function dispensarGuia() {
  S.guiaOculta = true;
  persist(); render();
}
function viewGuia(local) {
  if (!S || S.guiaOculta || S.tutorial) return ''; // contas novas usam o tutorial interativo, não esse aviso
  const passos = guiaPassos();
  const atual = passos.findIndex((x) => !x.ok);
  if (atual === -1) return '';   // tudo feito: a guia some sozinha
  const msgs = [
    `Oi! Eu sou a ${esc(SF_GUIA_NOME)}, sua guia aqui no app. Vou te ajudar a começar em 3 passos rápidos. Primeiro: cadastre quem vai usar — você e quem mais da família quiser acompanhar.`,
    'Boa! Agora cadastre uma conta, por exemplo a sua conta corrente. Basta o nome e o banco.',
    'Quase lá! Registre um gasto na aba Extrato ou importe o extrato do seu banco quando tiver em mãos.',
  ];
  const avatar = SF_GUIA_IMG ? `<img src="${SF_GUIA_IMG}" alt="">` : esc(SF_GUIA_NOME.charAt(0));
  const irContas = atual < 2 && local !== 'contas';
  const irExtrato = atual === 2;
  return `<div class="guia">
    <div class="guia-avatar">${avatar}</div>
    <div class="guia-balao">
      <div class="guia-nome">${esc(SF_GUIA_NOME)} · sua guia</div>
      ${msgs[atual]}
      <ul class="guia-passos">${passos.map((x, i) => `<li><span class="${x.ok ? 'ok' : 'pend'}">${x.ok ? '✓' : (i === atual ? '→' : '○')}</span><span>${x.txt}</span></li>`).join('')}</ul>
      <div class="btns">
        ${irContas ? `<button class="primary sm" onclick="setTab('contas')">Ir para Contas</button>` : ''}
        ${irExtrato ? `<button class="primary sm" onclick="setTab('extrato')">Ir para Extrato</button>` : ''}
        <button class="ghost sm" onclick="dispensarGuia()">Já sei usar</button>
      </div>
    </div>
  </div>`;
}

function viewInicio() {
  const d = dashboard(S);
  return `
  ${viewGuia('inicio')}
  <div class="hero">
    <div class="hero-label">Patrimônio da família</div>
    <div class="hero-value">${fmtBRL(d.totals.netWorth)}</div>
    <div class="hero-split">
      <div><span>Em conta</span><b>${fmtBRL(d.totals.inAccounts)}</b></div>
      <div><span>Aplicado</span><b class="brass">${fmtBRL(d.totals.invested)}</b></div>
      ${d.totals.cardDebt ? `<div><span>Cartões</span><b class="neg">${fmtBRL(d.totals.cardDebt)}</b></div>` : ''}
    </div>
    ${d.needsReview.length ? '<div class="hero-warn">⚠ Inclui conta(s) não conciliada(s) com o banco</div>' : (S.accounts.length ? '<div class="hero-ok">✓ Confere com os saldos do banco</div>' : '')}
  </div>
  <div class="card">
    <h3>${esc(monthLabel(d.month))}</h3>
    <div class="flow">
      <div><span>Receitas reais</span><b class="pos">${fmtBRL(d.monthFlow.income)}</b></div>
      <div><span>Despesas reais</span><b class="neg">${fmtBRL(d.monthFlow.expense)}</b></div>
      <div><span>Resultado</span><b class="${d.monthFlow.result >= 0 ? 'pos' : 'neg'}">${fmtBRL(d.monthFlow.result)}</b></div>
    </div>
    <div class="hint">Transferências entre as contas da família não entram aqui.</div>
  </div>
  ${d.cards.map((sum) => cardAlerts(sum).map((a) => `<div class="${a.tone === 'error' ? 'error' : 'banner warn'}">
      ${esc(sum.card.name)}: ${a.text}
      <div class="btns"><button class="primary sm" onclick="cardTab='${sum.card.id}';setTab('cartoes')">Abrir cartão</button></div>
    </div>`).join('')).join('')}
  ${(function(){ const dups = allDuplicateClusters(S); const n = Object.values(dups).reduce((s,c)=>s+c.reduce((m,x)=>m+x.removeIds.length,0),0);
    return n ? `<div class="banner warn">
      ⚠ ${n} possível(is) lançamento(s) duplicado(s) encontrado(s) entre importações — pode estar afetando o saldo.
      <div class="btns"><button class="primary sm" onclick="setTab('contas')">Revisar duplicatas</button></div>
    </div>` : ''; })()}
  ${(function(){ const ins = advisorInsights(S).filter(i=>i.severity==='ALERTA'); return ins.length ? `<div class="banner warn">
      ✦ ${ins.length} alerta(s) do consultor: ${esc(ins[0].title)}${ins.length>1?` (+${ins.length-1})`:''}.
      <div class="btns"><button class="primary sm" onclick="setTab('consultor')">Abrir consultor</button></div>
    </div>` : ''; })()}
  ${d.needsReview.length ? `<div class="banner warn">
      ⚠ <b>${d.needsReview.length} conta(s) precisam de conferência</b> — diferença total de ${fmtBRL(Math.abs(d.totalDiff))} em relação ao banco.
      <div class="btns"><button class="primary sm" onclick="setTab('auditoria')">Ver auditoria</button></div>
    </div>` : ''}
  ${d.budgetAlerts && d.budgetAlerts.length ? `<div class="banner warn">
      📊 ${d.budgetAlerts.filter(b=>b.status==='ESTOURADO').length ? d.budgetAlerts.filter(b=>b.status==='ESTOURADO').length + ' categoria(s) acima do habitual' : 'Gasto acelerado em ' + d.budgetAlerts.length + ' categoria(s)'}: ${esc(d.budgetAlerts.slice(0,3).map(b=>b.name).join(', '))}.
      <div class="btns"><button class="primary sm" onclick="setTab('relatorios')">Ver relatórios</button></div>
    </div>` : ''}
  ${d.overdue && d.overdue.length ? `<div class="banner warn">
      ⏰ ${d.overdue.length} compromisso(s) previsto(s) venceram sem pagamento correspondente no extrato.
      <div class="btns"><button class="primary sm" onclick="setTab('consolidado')">Ver consolidado</button></div>
    </div>` : ''}
  ${d.invAlerts && d.invAlerts.length ? `<div class="banner warn">
      📉 ${d.invAlerts.length} investimento(s) rendendo menos que o esperado ou abaixo da inflação.
      <div class="btns"><button class="primary sm" onclick="setTab('investir')">Ver investimentos</button></div>
    </div>` : ''}
  ${d.pendingSuggestions ? `<div class="banner">⇄ ${d.pendingSuggestions} possível(is) transferência(s) interna(s) aguardando confirmação na aba <b>Contas</b>.</div>` : ''}
  <div class="card">
    <h3>Contas</h3>
    ${d.accounts.map((a) => { const st = accountStatus(S, a); return `<div class="row">${dot(a.institution)}<div class="grow"><div class="desc">${esc(a.name)} ${st === 'NECESSITA_CONFERENCIA' ? '<span class="warn-mark">⚠</span>' : ''}</div><div class="sub">${esc(personName(S, a.ownerId))}</div></div><div class="amt">${fmtBRL(a.balance)}</div></div>`; }).join('') || '<div class="empty">Cadastre pessoas e contas na aba Contas para começar.</div>'}
  </div>
  <div class="card">
    <h3>Últimos lançamentos</h3>
    ${d.latest.map(txRow).join('') || '<div class="empty">Nenhum lançamento ainda — lance manualmente na aba Extrato ou importe um extrato.</div>'}
  </div>`;
}

function viewImportar() {
  if (!S.accounts.length) return '<div class="card"><div class="empty">Antes de importar, cadastre pessoas e contas na aba <b>Contas</b>.</div></div>';
  const err = imp.error ? `<div class="error">${esc(imp.error)}</div>` : '';
  if (imp.step === 0) return `${err}<div class="card center">
    <h3>Escolha o extrato</h3>
    <p class="sub">PDF, CSV ou OFX. Eu leio o arquivo aqui no seu aparelho, descubro de qual conta ele é e mostro tudo para você confirmar antes de gravar.</p>
    <label class="primary btn-file">${imp.busy ? 'Lendo…' : 'Selecionar arquivo'}<input type="file" accept=".pdf,.csv,.ofx,.txt" onchange="impFile(this.files[0])" ${imp.busy ? 'disabled' : ''}></label>
  </div>`;
  if (imp.step === 1) return `${err}${viewConfirmacao()}`;
  if (imp.step === 2) {
    const n = imp.rows.filter((r) => r.verdict !== 'DUP_EXACT' && imp.include[r.index]).length;
    const sum = {
      novo: imp.rows.filter((r) => r.verdict === 'NEW').length,
      dup: imp.rows.filter((r) => r.verdict === 'DUP_EXACT').length,
      fuzzy: imp.rows.filter((r) => r.verdict === 'DUP_FUZZY').length,
      transf: imp.rows.filter((r) => r.transfer).length,
    };
    return `${err}<div class="card">
      <h3>${esc(imp.fileName)}</h3>
      <div class="chips">
        <span class="chip">${sum.novo} novos</span>
        ${sum.dup ? `<span class="chip">${sum.dup} já importados</span>` : ''}
        ${sum.fuzzy ? `<span class="chip brass-chip">${sum.fuzzy} possíveis duplicatas</span>` : ''}
        ${sum.transf ? `<span class="chip neutral-chip">⇄ ${sum.transf} transferências internas</span>` : ''}
      </div>
    </div>
    <div class="card">
      ${imp.rows.map((r) => `<div class="row review ${r.verdict === 'DUP_EXACT' ? 'faded' : ''}">
        <input type="checkbox" ${r.verdict === 'DUP_EXACT' ? 'disabled' : (imp.include[r.index] ? 'checked' : '')} onchange="imp.include[${r.index}]=this.checked;render()">
        <div class="grow">
          <div class="desc">${esc(r.tx.descriptionRaw)}</div>
          <div class="sub">${fmtDate(r.tx.date)}</div>
          ${r.verdict === 'DUP_EXACT' ? '<span class="chip">Já importado</span>' : ''}
          ${r.verdict === 'DUP_FUZZY' ? `<span class="chip brass-chip">Parece igual a: ${esc((r.fuzzyOf?.desc || '').slice(0, 38))}…</span>` : ''}
          ${r.transfer ? `<span class="chip neutral-chip">⇄ Interna · ${r.transfer.score} pts · ${esc(r.transfer.with?.source || '')}</span>` : ''}
          ${r.verdict === 'NEW' && !r.transfer ? `<select class="cat" onchange="imp.cat[${r.index}]=this.value">
              <option value="">Sem categoria</option>
              ${S.categories.map((c) => `<option value="${c.id}" ${(imp.cat[r.index] ?? r.suggestedCategoryId) === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
            </select>` : ''}
        </div>
        <div class="amt ${r.tx.amount >= 0 ? 'pos' : 'neg'}">${fmtBRL(r.tx.amount)}</div>
      </div>`).join('')}
    </div>
    <button class="primary big" ${n === 0 ? 'disabled' : ''} onclick="impCommit()">Importar ${n} lançamento(s)</button>
    <button class="ghost" onclick="imp.step=1;render()">Voltar</button>
    <button class="ghost" onclick="impReset()">Cancelar</button>`;
  }
  const r = imp.result;
  return `<div class="card center">
    <h3>Extrato importado</h3>
    <p>${r.imported} lançamento(s) novos · ${r.skipped} ignorado(s)</p>
    ${r.links.confirmed ? `<div class="banner ok">⇄ ${r.links.confirmed} transferência(s) interna(s) vinculada(s) automaticamente — não contam como receita nem despesa.</div>` : ''}
    ${r.links.suggested ? `<div class="banner">⇄ ${r.links.suggested} possível(is) transferência(s) aguardando confirmação na aba Contas.</div>` : ''}
    ${reconciliationSummary(r.reconciliation)}
    <button class="primary" onclick="impReset()">Importar outro extrato</button>
  </div>`;
}

function reconciliationSummary(rec) {
  if (!rec) return '';
  let html = '';
  if (rec.anchored) html += `<div class="banner ok">Saldo inicial desta conta capturado automaticamente do extrato — nada para digitar.</div>`;
  if (rec.reanchored) html += `<div class="banner">Extrato mais antigo importado: a referência de saldo recuou para o início deste período.${rec.anchorBridgeDiff ? ` <b>Atenção:</b> a emenda com o período seguinte tem diferença de ${fmtBRL(Math.abs(rec.anchorBridgeDiff))}.` : ''}</div>`;
  if (rec.noBalances) html += `<div class="banner">Este arquivo não informa saldo (CSV de conta costuma não trazer). Para conferência automática com o banco, importe o <b>OFX</b> ou o <b>PDF</b> desta conta.</div>`;
  for (const c of rec.checks || []) {
    html += c.status === 'OK'
      ? `<div class="banner ok">✓ Conferido: saldo em ${fmtDate(c.refDate)} bate com o banco no centavo (${fmtBRL(c.bankBalance)}).</div>`
      : `<div class="banner warn">⚠ Divergência de <b>${fmtBRL(Math.abs(c.difference))}</b> em ${fmtDate(c.refDate)}: banco ${fmtBRL(c.bankBalance)} × sistema ${fmtBRL(c.computedBalance)}.
          <div class="btns">
            <button class="primary sm" onclick="setTab('auditoria')">Ver o que houve</button>
            <button class="ghost sm" onclick="printDivergenceReport('${c.id}')">Relatório em PDF</button>
          </div></div>`;
  }
  return html;
}

function viewAuditoria() {
  if (!S.checks.length) return `<div class="card"><h3>Auditoria de saldos</h3>

  const byAccount = {};

async function doSetup() {

    setupRecovery = await SFSec.createVault(p1, initial);

/** Baixa um arquivo pro aparelho. Precisa estar DE VERDADE na página (appendChild) antes
 *  do clique simulado — sem isso, o download falha silenciosamente em vários navegadores
 *  de celular, principalmente dentro de PWA instalado. */
function baixarArquivo(nome, blob) {
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url; a.download = nome; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadRecovery() {
  const blob = new Blob(['Smart Finance Family — código de recuperação\n\n' + setupRecovery +
    '\n\nGuarde este código. Sem ele e sem a senha, os dados não podem ser abertos por ninguém.\n'], { type: 'text/plain' });

  </div>`;
}
async function doUnlock() {

  lockBusy = true; lockMsg = ''; render();

    S = migrateState(st);
    persist();
    unlockedBoot();
    return;
  } catch (e) { lockMsg = e.message; }
  lockBusy = false; render();
}

const VALID_TABS = ['inicio', 'consolidado', 'importar', 'extrato', 'contas', 'calendario', 'consultor', 'relatorios', 'auditoria', 'investir', 'cartoes', 'seguranca', 'mais'];

function unlockedBoot() {
  document.body.classList.remove('locked');

  setValuesHidden(true); // toda vez que o app abre ou desbloqueia, os valores começam ocultos
  syncEyeIcon();
  touchActivity();
  if (lockTimer) clearInterval(lockTimer);
  lockTimer = setInterval(checkAutoLock, 15000);
  render();
}
function lockNow(reason) {
  SFSec.lock();
  S = null; pendingAuth = null;
  if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
  lockView = 'senha'; lockMsg = reason || '';
  bootScreen();
}
function touchActivity() { lastActivity = Date.now(); }
function checkAutoLock() {
  if (!SFSec.isUnlocked()) return;
  const mins = SFSec.settings().autoLockMinutes;
  if (mins === null || mins === undefined) return; // "nunca"
  if (mins === 0 || Date.now() - lastActivity >= mins * 60000) lockNow('Bloqueado automaticamente por inatividade.');

async function confirmAuth() {
  const pwd = $('#ra-pwd').value;
  const ok = await SFSec.verifyPassword(pwd);
  if (!ok) {
    lockMsg = 'Senha incorreta.';
    SFSec.logEvent(S, 'FALHA_REAUTENTICACAO', 'SENHA', pendingAuth.reason); persist();
    render(); return;
  }
  const action = pendingAuth.onOk;
  SFSec.logEvent(S, 'ACAO_CRITICA', 'SENHA', pendingAuth.reason);
  pendingAuth = null; lockMsg = '';
  await action();
  persist(); render();
}

/* Só se aplica a contas criadas a partir desta versão (têm S.createdAt).

   lançamento) ficam permanentemente isentas — não quebra a promessa já feita. */

function diasRestantesAvaliacao() {
  if (!S || !S.createdAt || S.license) return null;
  const inicio = new Date(S.createdAt).getTime();
  if (Number.isNaN(inicio)) return null;
  const limite = inicio + SF_TRIAL_DIAS * 24 * 60 * 60 * 1000;
  const restam = Math.ceil((limite - Date.now()) / (24 * 60 * 60 * 1000));
  return restam > 0 ? restam : 0;
}

const SF_LICENSE_PUBKEY = { key_ops: ['verify'], ext: true, kty: 'EC',
  x: 'qdfUehsWMwd5OVo9k0zgF1GHgEVuoLChzlaDC8HuGCI', y: 'RktXdDT4i7N4Iry8DmISwym5RS5E7xf6_86EyvhJ-1Q', crv: 'P-256' };
function b64urlToBuf(s) {
  const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + pad;
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
/* Código único do aparelho, gerado uma vez e guardado no próprio estado —
   não depende de servidor. É isso que impede o arquivo de licença de
   simplesmente ser copiado e reaproveitado noutro celular. */
function getOrCreateDeviceId() {
  if (!S) return null;
  if (!S.deviceId) {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem O/0/I/1, evita confusão visual
    let s = '';
    for (let i = 0; i < 8; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
    S.deviceId = s.slice(0, 4) + '-' + s.slice(4);
    persist();
  }
  return S.deviceId;
}
async function handleLicenseFile(file) {
  const statusEl = document.getElementById('license-status');
  if (!file) return;
  try {
    const text = await file.text();
    const { payload, assinatura } = JSON.parse(text);
    if (!payload || !assinatura) throw new Error('Arquivo de licença mal formado.');
    const publicKey = await crypto.subtle.importKey('jwk', SF_LICENSE_PUBKEY, { name: 'ECDSA', namedCurve: 'P-256' }, true, ['verify']);
    const enc = new TextEncoder().encode(JSON.stringify(payload));
    const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, publicKey, b64urlToBuf(assinatura), enc);
    if (!ok) { statusEl.innerHTML = '❌ Essa licença não bateu com a assinatura oficial — verifique o arquivo.'; return; }
    const meuCodigo = getOrCreateDeviceId();
    if (payload.deviceId !== meuCodigo) {
      statusEl.innerHTML = `❌ Essa licença não é deste aparelho (código deste aparelho: <b>${esc(meuCodigo)}</b>). Peça uma licença nova com esse código.`;
      return;
    }
    S.license = payload;
    persistNow();
    render();
  } catch (e) {
    statusEl.innerHTML = '❌ Não consegui ler esse arquivo: ' + esc(e.message);
  }
}

  if (!imp.lines) { alert('Este formato não permite recalibrar — vale para extratos em PDF.'); return; }
  const hint = SFCore.parseMoney(imp.closingHint || '');
  const contaSel = accountById(S, imp.accountId) || {};
  const inst = layoutProfileKey((imp.resolution && imp.resolution.identity.institution) || contaSel.institution || 'OUTRO', contaSel.customBankName);
  const read = readStatement(S, inst, imp.lines, Number.isNaN(hint) ? undefined : hint);
  imp.calibration = read;
  imp.txs = read.parsed.txs;
  imp.statement = { ...read.parsed, lines: imp.lines, calibration: read };
  if (imp.accountId && imp.step === 2) {
    imp.rows = previewImport(S, imp.accountId, imp.txs);
    imp.include = {}; imp.cat = {};
    imp.rows.forEach((r) => { imp.include[r.index] = r.verdict === 'NEW'; });
  }
  render();
}

/** Gráfico de linha em SVG puro — sem biblioteca, funciona offline. */
function sparkline(points, height) {
  if (points.length < 2) return '<div class="empty">Importe alguns meses para ver a evolução.</div>';
  const h = height || 120, w = 300, pad = 4;
  const vals = points.map((p) => p.total);
  const min = Math.min(...vals, 0), max = Math.max(...vals, 1);
  const x = (i) => pad + (i * (w - pad * 2)) / (points.length - 1);
  const y = (v) => h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join(' ');
  const area = `${line} L${x(points.length-1).toFixed(1)},${h-pad} L${x(0).toFixed(1)},${h-pad} Z`;
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none">
      <path d="${area}" fill="rgba(20,38,61,.08)"/>
      <path d="${line}" fill="none" stroke="#14263D" stroke-width="2" stroke-linejoin="round"/>
      ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.total).toFixed(1)}" r="${i === points.length-1 ? 3.5 : 2}" fill="${i === points.length-1 ? '#B98A2F' : '#14263D'}"/>`).join('')}
    </svg>
    <div class="sparklabels">${points.map((p, i) => `<span>${i % Math.ceil(points.length/6) === 0 || i === points.length-1 ? monthLabelShort(p.month) : ''}</span>`).join('')}</div>
    <div class="sub">Hoje: <b>${fmtBRL(last.total)}</b> · em conta ${fmtBRL(last.inAccounts)} · aplicado ${fmtBRL(last.invested)}</div>`;
}

/* ═════════ Limpeza retroativa de duplicatas ═════════ */
let dupExpanded = {};

function viewDuplicatesCard() {
  const byAccount = allDuplicateClusters(S);
  const accountIds = Object.keys(byAccount);
  if (!accountIds.length) return '';
  const totalClusters = accountIds.reduce((n, id) => n + byAccount[id].length, 0);
  const totalExtra = accountIds.reduce((n, id) => n + byAccount[id].reduce((m, c) => m + c.removeIds.length, 0), 0);

  return `<div class="card">
    <h3>⚠ Possíveis duplicatas encontradas</h3>
    <div class="banner warn">
      ${totalClusters} grupo(s) de lançamentos que parecem repetidos entre importações diferentes —
      ${totalExtra} lançamento(s) a mais, afetando o saldo dessas contas.
      Isso costuma acontecer quando o mesmo extrato foi importado mais de uma vez e não foi reconhecido como duplicata.
    </div>
    ${accountIds.map((accId) => {
      const acc = accountById(S, accId);
      const clusters = byAccount[accId];
      const open = !!dupExpanded[accId];
      return `<div class="opt">
        <div class="row"><div class="grow">
          <div class="desc">${dot(acc ? acc.institution : 'OUTRO')} ${esc(acc ? acc.name : 'Conta removida')}</div>
          <div class="sub">${clusters.length} grupo(s) suspeito(s)</div>
        </div><button class="ghost sm" onclick="dupExpanded['${accId}']=!dupExpanded['${accId}'];render()">${open ? 'Fechar' : 'Revisar'}</button></div>
        ${open ? clusters.map((c, ci) => `<div class="dupcluster">
          <div class="sub">${fmtDate(c.date)} · ${fmtBRL(c.amount)} · repetido ${c.transactions.length}×</div>
          ${c.transactions.map((t) => `<div class="row"><div class="grow"><div class="desc">${esc(t.descriptionRaw)}</div>
            <div class="sub">${t.id === c.keepId ? '<span class="pos">manter (importado primeiro)</span>' : '<span class="neg">remover — parece duplicata</span>'}</div></div></div>`).join('')}
          <div class="btns">
            <button class="primary sm" onclick="doRemoveDuplicates('${accId}', ${ci})">Remover ${c.removeIds.length} repetido(s), manter o original</button>
          </div>
        </div>`).join('') : ''}
      </div>`;
    }).join('')}
    <div class="hint">Comparo lançamentos com mesma data, mesmo valor e descrição muito parecida vindos de importações diferentes. Duplicatas legítimas do mesmo arquivo (ex.: dois cafés iguais no mesmo dia) nunca aparecem aqui.</div>
  </div>`;
}

function doRemoveDuplicates(accountId, clusterIndex) {
  const clusters = duplicateClustersFor(S, accountId);
  const cluster = clusters[clusterIndex];
  if (!cluster) return;
  requireAuth(`Remover ${cluster.removeIds.length} lançamento(s) duplicado(s) de ${fmtDate(cluster.date)}, mantendo o original.`, async () => {
    const removed = removeDuplicateTx(S, cluster.removeIds);
    SFSec.logEvent(S, 'ACAO_CRITICA', null, `${removed} duplicata(s) removida(s) em ${accountId}`);
  });
}

    pctOfIndex: debtForm.investPct, horizonMonths: debtForm.debtMonths,
  });
  const label = r.recommendation === 'QUITAR' ? 'Quitar a dívida agora vale mais'
    : r.recommendation === 'INVESTIR' ? 'Investir vale mais que quitar agora'
    : 'As duas opções ficam próximas — outros fatores (tranquilidade, prioridade) pesam mais aqui';
  return `<table class="audit"><tbody>
    <tr><td>Juros evitados quitando agora</td><td class="rt">${fmtBRL(r.payoffSavings)}</td></tr>
    <tr><td>Ganho líquido investindo o mesmo valor</td><td class="rt">${fmtBRL(r.investNetGain)}</td></tr>
    <tr class="good"><td><b>${esc(label)}</b></td><td class="rt"><b>${r.difference>=0?'+':''}${fmtBRL(r.difference)}</b></td></tr>
  </tbody></table>
  <div class="hint">Simulação aritmética simples — não considera efeitos como score de crédito, tranquilidade emocional de ficar sem dívida, ou mudanças futuras nas taxas.</div>`;
}
function copyAdvisorSummary() {
  const text = advisorSummaryText(S);
  navigator.clipboard?.writeText(text);
  alert('Resumo copiado. Cole em qualquer assistente de IA para conversar sobre os números.');
}

/* ═════════ Consolidado — previsto × realizado (seção 8) ═════════ */
let consBack = 3, consAhead = 8, planForm = { open: false, kind: 'A_PAGAR', installments: 1 };
const monthName = (ym) => {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }).replace('.', '');
};
const sig = (v) => (v >= 0 ? 'pos' : 'neg');

function viewConsolidado() {
  const c = consolidatedView(S, consBack, consAhead);
  const P = c.position;

  const posCard = `<div class="card">
    <h3>Posição de hoje</h3>
    <table class="audit"><thead><tr><th></th><th class="rt">Em conta</th><th class="rt">Aplicado</th><th class="rt">Total</th></tr></thead>
    <tbody>
      ${P.rows.map((r) => `<tr><td>${esc(r.person.name.split(' ')[0])}</td>
        <td class="rt">${fmtBRL(r.inAccounts)}</td><td class="rt">${fmtBRL(r.invested)}</td><td class="rt"><b>${fmtBRL(r.total)}</b></td></tr>`).join('')}
      <tr class="good"><td><b>Família</b></td><td class="rt"><b>${fmtBRL(P.family.inAccounts)}</b></td>
        <td class="rt"><b>${fmtBRL(P.family.invested)}</b></td><td class="rt"><b>${fmtBRL(P.family.total)}</b></td></tr>
    </tbody></table>
    ${P.rows.length === 0 ? '<div class="empty">Cadastre pessoas e contas para ver a posição por pessoa.</div>' : ''}
  </div>`;

  const accountsCard = `<div class="card">
    <h3>Saldo por conta</h3>
    ${S.accounts.map((a) => `<div class="row">${dot(a.institution)}<div class="grow">
        <div class="desc">${esc(a.name)}</div>
        <div class="sub">${esc(personName(S, a.ownerId))}${accountStatus(S, a) === 'NECESSITA_CONFERENCIA' ? ' · <span class="neg">⚠ necessita conferência</span>' : ''}</div>
      </div><div class="amt">${fmtBRL(balance(S, a))}</div></div>`).join('') || '<div class="empty">Nenhuma conta cadastrada ainda.</div>'}
  </div>`;

  const alerts = c.overdue.length ? `<div class="banner warn">
      ⏰ ${c.overdue.length} compromisso(s) vencido(s) sem lançamento correspondente:
      ${c.overdue.slice(0, 3).map((p) => `<div class="sub">${fmtDate(p.dueDate)} · ${esc(p.description)} · <b>${fmtBRL(p.expectedAmount)}</b></div>`).join('')}
    </div>` : '';

  const monthsCard = `<div class="card">
    <h3>Mês a mês</h3>
    <div class="chips">
      <button class="chip clickable ${consAhead===4?'sel':''}" onclick="consAhead=4;render()">6 meses</button>
      <button class="chip clickable ${consAhead===8?'sel':''}" onclick="consAhead=8;render()">12 meses</button>
      <button class="chip clickable ${consAhead===20?'sel':''}" onclick="consAhead=20;render()">24 meses</button>
    </div>
    <div class="scrollx"><table class="audit cons"><thead><tr>
      <th>Mês</th><th class="rt">A receber</th><th class="rt">Recebido</th><th class="rt">A pagar</th><th class="rt">Pago</th>
      <th class="rt">Resultado</th><th class="rt">Saldo projetado</th></tr></thead><tbody>
      ${c.months.map((m) => `<tr class="${m.isCurrent ? 'good' : ''}">
        <td><b>${monthName(m.month)}</b>${m.isCurrent ? '<div class="sub">em curso</div>' : ''}</td>
        <td class="rt">${m.expectedIn ? fmtBRL(m.expectedIn) : '—'}</td>
        <td class="rt ${m.realizedIn ? 'pos' : ''}">${m.isPast || m.isCurrent ? fmtBRL(m.realizedIn) : '—'}</td>
        <td class="rt">${m.expectedOut ? fmtBRL(m.expectedOut) : '—'}</td>
        <td class="rt ${m.realizedOut ? 'neg' : ''}">${m.isPast || m.isCurrent ? fmtBRL(m.realizedOut) : '—'}</td>
        <td class="rt">${m.isPast || m.isCurrent
            ? `<span class="${sig(m.realizedResult)}">${fmtBRL(m.realizedResult)}</span>${m.deviation !== null && m.expectedResult ? `<div class="sub ${sig(m.deviation)}">${m.deviation >= 0 ? '+' : ''}${fmtBRL(m.deviation)} vs previsto</div>` : ''}`
            : `<span class="${sig(m.expectedResult)}">${fmtBRL(m.expectedResult)}</span><div class="sub">previsto</div>`}</td>
        <td class="rt">${m.projectedBalance !== null ? `<b>${fmtBRL(m.projectedBalance)}</b>` : '—'}</td>
      </tr>`).join('')}
    </tbody></table></div>
    <div class="hint">Meses passados comparam o que foi previsto com o que aconteceu. Meses futuros somam recorrências detectadas e compromissos cadastrados, acumulando o saldo projetado a partir do patrimônio de hoje.</div>
  </div>`;

  const upcoming = c.upcoming.length ? `<div class="card">
    <h3>Próximos compromissos</h3>
    ${c.upcoming.map((p) => `<div class="row"><div class="grow">
      <div class="desc">${esc(p.description)}${p.installmentInfo ? ` <span class="chip">${p.installmentInfo}</span>` : ''}</div>
      <div class="sub">${fmtDate(p.dueDate)}${p.recurringKey ? ' · recorrente' : ''}</div></div>
      <div class="amt ${p.kind === 'A_PAGAR' ? 'neg' : 'pos'}">${p.kind === 'A_PAGAR' ? '-' : ''}${fmtBRL(p.expectedAmount)}</div>
      <button class="ghost sm" onclick="removePlanned('${p.id}')">×</button></div>`).join('')}
  </div>` : '';

  const recCard = `<div class="card">
    <h3>Recorrências detectadas</h3>
    ${c.recurring.length ? c.recurring.slice(0, 8).map((r) => {
      const already = S.planned.some((p) => p.recurringKey === r.key);
      return `<div class="row"><div class="grow">
        <div class="desc">${esc(r.label)}</div>
        <div class="sub">todo dia ${r.dayOfMonth} · ${r.occurrences} ocorrências · confiança ${(r.confidence * 100).toFixed(0)}%</div>

      <div class="hint">Parcelamentos viram uma série: 12 parcelas geram 12 vencimentos mensais, cada um conciliado com o extrato quando o pagamento aparecer.</div>
    </div>` : ''}
  </div>`;

  return posCard + accountsCard + alerts + monthsCard + upcoming + viewMetasCard() + recCard + form;
}

function doAddPlanned() {
  const desc = $('#pl-desc').value.trim();
  const amount = SFCore.parseMoney($('#pl-amount').value || '');
  const date = SFCore.brDateToISO($('#pl-date').value.trim());
  const inst = parseInt($('#pl-inst').value || '1', 10);
  if (!desc || Number.isNaN(amount) || amount === 0 || !date) {
    alert('Preencha descrição, valor e a data do primeiro vencimento (dd/mm/aaaa).'); return;
  }
  addPlanned(S, { description: desc, kind: planForm.kind, dueDate: date,
    expectedAmount: Math.abs(amount), categoryId: $('#pl-cat').value || null }, inst);
  planForm.open = false; persist(); render();
}
function removePlanned(id) {
  S.planned = S.planned.filter((p) => p.id !== id);
  persist(); render();
}
function doPromote(key) {
  const n = promoteRecurring(S, key, 12);
  persist(); render();
  if (!n) alert('Esses meses já estavam previstos.');
}

/* ═════════ Consultor de Investimentos (aba Investir) ═════════ */
const pct = (f, d) => (f * 100).toFixed(d === undefined ? 2 : d).replace('.', ',') + '%';
const INV_TYPES = ['COFRINHO','CDB','RDB','LCI','LCA','TESOURO_SELIC','CONTA_REMUNERADA','FUNDO_DI','POUPANCA','OUTRO'];
const INDEXES = ['CDI','SELIC','IPCA','PRE','POUPANCA'];
const LIQ = { DIARIA: 'Liquidez diária', VENCIMENTO: 'Só no vencimento', CARENCIA: 'Com carência' };
let invHorizon = 12, invCompareId = '', simForm = { amount: '', months: 12, pct: 1.2 };
let marketFetch = { state: 'idle', message: '' }; // idle | loading | ok | error
let autoFetchAttempted = false;

function viewInvestir() {
  const rep = investmentReport(S);
  const m = rep.market;
  const stale = rep.freshness.stale;
  // primeira vez que a aba abre com dado velho: tenta atualizar sozinho, sem incomodar se falhar

    autoFetchAttempted = true;
    fetchMarketAuto(true);
  }

  const marketCard = `<div class="card">
    <h3>Indicadores de mercado</h3>
    <div class="flow">
      <div><span>CDI</span><b>${pct(m.cdiAnnual)}</b></div>

    <div class="hint">Fonte: ${esc(m.source)} · consultado em ${fmtDate(m.consultedAt)}${stale ? ` · <b class="neg">desatualizado há ${rep.freshness.days} dias</b>` : ''}</div>
    <div class="btns">
      <button class="primary sm" onclick="fetchMarketAuto()" ${marketFetch.state==='loading'?'disabled':''}>${marketFetch.state==='loading'?'Buscando…':'Atualizar CDI/Selic/IPCA agora'}</button>

    </div>
    ${marketFetch.state==='ok' ? `<div class="banner ok">✓ ${esc(marketFetch.message)}</div>` : ''}
    ${marketFetch.state==='error' ? `<div class="banner warn">⚠ ${esc(marketFetch.message)}</div>` : ''}
    <div class="hint">Busca direto do Banco Central e do IBGE (dados públicos oficiais) — não depende de mim nem de nenhum assistente de IA. Só precisa de internet.</div>
    ${stale ? '<div class="banner warn">CDI/Selic/IPCA há mais de 30 dias sem atualizar. Toque em "Atualizar agora".</div>' : ''}
    <div id="form-market" class="form hidden">
      <input id="mk-cdi" placeholder="CDI ao ano, ex.: 14,15" value="${(m.cdiAnnual*100).toFixed(2).replace('.',',')}">
      <input id="mk-selic" placeholder="Selic ao ano, ex.: 14,25" value="${(m.selicAnnual*100).toFixed(2).replace('.',',')}">
      <input id="mk-ipca" placeholder="IPCA 12 meses, ex.: 4,64" value="${(m.ipca12m*100).toFixed(2).replace('.',',')}">
      <input id="mk-src" placeholder="Fonte (ex.: BCB/IBGE)" value="${esc(m.source)}">
      <button class="primary" onclick="saveMarket()">Salvar indicadores</button>
      <div class="hint">Ofertas específicas de bancos (CDB, LCI, promoções) não têm fonte pública para o app buscar sozinho — nenhum site de banco libera esse dado para outro site ler diretamente, por segurança do próprio navegador. Isso vale tanto para mim quanto para qualquer outra IA.</div>
      <div class="hint">Duas formas de conseguir isso sem depender de mim:</div>
      <div class="sub">1) Pesquise você mesmo em um comparador confiável e cole o resultado abaixo:</div>
      <div class="chips">${['iDinheiro','InfoMoney','Comparação BC (RankBrasil)'].map((n)=>`<span class="chip">${n}</span>`).join('')}</div>
      <div class="sub">2) Peça a qualquer IA com busca na web (não precisa ser este Claude): "pesquise CDB, LCI e contas remuneradas de baixo risco hoje e devolva em JSON com institution, product, index, pctOfIndex, liquidity, fgc, source, consultedAt".</div>
      <textarea id="mk-json" rows="3" placeholder='[{"institution":"Banco X","product":"CDB","pctOfIndex":1.2,...}]'></textarea>
      <button class="ghost sm" onclick="importOptions()">Carregar ofertas</button>
    </div>
  </div>`;

  const suggestable = S.accounts.filter((a) => ['COFRINHO','INVESTIMENTO','POUPANCA'].includes(a.type))
    .filter((a) => !S.investments.some((i) => i.accountId === a.id));

  const portfolio = `<div class="card">
    <h3>Seus investimentos <button class="primary sm right" onclick="toggle('form-inv')">Adicionar</button></h3>
    ${rep.rows.length ? `<div class="flow">
      <div><span>Aplicado</span><b>${fmtBRL(rep.totalApplied)}</b></div>
      <div><span>Saldo hoje</span><b>${fmtBRL(rep.totalBalance)}</b></div>
      <div><span>Rendimento</span><b class="${rep.totalGain >= 0 ? 'pos' : 'neg'}">${fmtBRL(rep.totalGain)}</b></div>
    </div>` : ''}
    <div id="form-inv" class="form hidden">
      ${suggestable.length ? `<div class="hint">Contas que já parecem investimento:</div>
        <div class="chips">${suggestable.map((a) => `<button class="chip clickable" onclick="addFromAccount('${a.id}')">+ ${esc(a.name)}</button>`).join('')}</div>` : ''}
      <input id="inv-inst" placeholder="Instituição (ex.: Nubank)">
      <select id="inv-type">${INV_TYPES.map((t) => `<option value="${t}">${t.replace(/_/g,' ')}</option>`).join('')}</select>

      <input id="inv-balance" placeholder="Saldo atual (ex.: 10.680,00)">
      <select id="inv-index">${INDEXES.map((i) => `<option value="${i}">${i}</option>`).join('')}</select>
      <input id="inv-pct" placeholder="% do indexador (ex.: 100 ou 120)" value="100">
      <select id="inv-liq">${Object.keys(LIQ).map((k) => `<option value="${k}">${LIQ[k]}</option>`).join('')}</select>
      <input id="inv-maturity" placeholder="Vencimento (opcional, dd/mm/aaaa)">
      <label class="check"><input type="checkbox" id="inv-fgc" checked> Coberto pelo FGC</label>
      <button class="primary" onclick="addInvestment()">Salvar investimento</button>
    </div>
    ${rep.rows.map(({ inv, perf }) => `<div class="inv">
      <div class="row">${dot(inv.institution)}<div class="grow">
        <div class="desc">${esc(inv.institution)} · ${esc(inv.type.replace(/_/g,' '))}</div>
        <div class="sub">${LIQ[inv.liquidity]} · ${inv.index}${inv.pctOfIndex ? ' ' + pct(inv.pctOfIndex, 0) : ''}${inv.maturity ? ' · vence ' + fmtDate(inv.maturity) : ''}${inv.fgc ? ' · FGC' : ''}</div>

      <table class="audit"><tbody>
        <tr><td>Aplicado em ${fmtDate(inv.appliedAt)} (${perf.days} dias)</td><td class="rt">${fmtBRL(perf.appliedAmount)}</td></tr>

        <tr><td>Equivalente ao mês / ao ano</td><td class="rt">${pct(perf.monthlyPct)} · ${pct(perf.annualPct)}</td></tr>
        <tr><td>Entregou do CDI</td><td class="rt"><b>${pct(perf.cdiEquivalent, 0)}</b> do CDI</td></tr>
        ${perf.expectedBalance != null ? `<tr class="${perf.deviation < -100 ? 'bad' : ''}"><td>Contratado ${pct(inv.pctOfIndex || 0, 0)} → esperado</td><td class="rt">${fmtBRL(perf.expectedBalance)} <span class="${perf.deviation >= 0 ? 'pos' : 'neg'}">(${perf.deviation >= 0 ? '+' : ''}${fmtBRL(perf.deviation)})</span></td></tr>` : ''}
        <tr><td>Ganho real (acima do IPCA)</td><td class="rt ${perf.beatsInflation ? 'pos' : 'neg'}">${pct(perf.realAnnualPct)} a.a.</td></tr>
      </tbody></table>
      <div class="btns">
        <button class="ghost sm" onclick="openInvQuick('${inv.id}','APORTE')">+ Aporte</button>
        <button class="ghost sm" onclick="openInvQuick('${inv.id}','RESGATE')">− Resgate</button>
        <button class="ghost sm" onclick="openInvQuick('${inv.id}','RENDIMENTO')">% Rendimento</button>
        <button class="primary sm" onclick="invCompareId='${inv.id}';render()">Comparar com o mercado</button>
        <button class="ghost sm" onclick="removeInvestment('${inv.id}')">Remover</button>
      </div>
      ${invQuickForm.open && invQuickForm.invId === inv.id ? invQuickFormHtml(inv) : ''}
    </div>`).join('') || '<div class="empty">Nenhum investimento cadastrado. Se você já tem cofrinho ou poupança como conta, use o botão Adicionar para trazer os dados automaticamente.</div>'}
    ${rep.fgc.filter((f) => f.uncovered > 0).map((f) => `<div class="banner warn">⚠ Em ${esc(f.institution)} você tem ${fmtBRL(f.total)}; o FGC cobre até R$ 250.000 por instituição — ${fmtBRL(f.uncovered)} ficam sem garantia. Vale dividir entre bancos.</div>`).join('')}
  </div>`;

  return marketCard + portfolio + viewComparador() + viewSimulador();
}

function viewComparador() {
  if (!invCompareId) return '';
  const c = compareInvestment(S, invCompareId, Math.round(invHorizon * 30.4375));
  if (!c) return '';
  const noOptions = !c.comparisons.length;
  return `<div class="card">
    <h3>Comparação — ${esc(c.inv.institution)} ${esc(c.inv.type.replace(/_/g,' '))}</h3>
    <div class="sub">Sobre ${fmtBRL(c.principal)} em ${invHorizon} meses. Seu rendimento líquido hoje: <b>${fmtBRL(c.current.netGain)}</b> (${pct(c.current.netAnnualPct)} a.a. líquido).</div>
    <div class="chips">${[6,12,24].map((h) => `<button class="chip ${invHorizon===h?'sel':''} clickable" onclick="invHorizon=${h};render()">${h} meses</button>`).join('')}</div>
    ${noOptions ? `<div class="empty">Nenhuma oferta cadastrada para comparar. Peça ao Claude: <i>"pesquise CDB, LCI e contas remuneradas de baixo risco hoje"</i> e carregue o JSON em "Atualizar dados de mercado".</div>` : ''}
    ${c.comparisons.map((x) => `<div class="opt ${x.extraGain > 0 ? 'good' : ''}">
      <div class="row"><div class="grow">
        <div class="desc">${esc(x.option.institution)} · ${esc(x.option.product)} ${x.option.pctOfIndex ? pct(x.option.pctOfIndex, 0) + ' do ' + x.option.index : ''}</div>
        <div class="sub">${LIQ[x.option.liquidity]}${x.option.minTermDays ? ' · prazo mín. ' + x.option.minTermDays + ' dias' : ''} · ${x.option.fgc ? 'FGC' : 'sem FGC'}</div>
      </div><div class="amt ${x.extraGain >= 0 ? 'pos' : 'neg'}">${x.extraGain >= 0 ? '+' : ''}${fmtBRL(x.extraGain)}</div></div>
      <div class="sub">Renderia ${fmtBRL(x.optionNet - c.principal)} líquidos (${pct(x.optionNetAnnualPct)} a.a.) contra ${fmtBRL(c.current.netGain)} do atual.</div>
      ${x.warnings.map((w) => `<div class="warnline">⚠ ${esc(w)}</div>`).join('')}
      <div class="sub src">Fonte: ${esc(x.option.source)} · ${fmtDate(x.option.consultedAt)}</div>
    </div>`).join('')}
    <div class="hint">Sugestões para você decidir — nada é aplicado automaticamente. Considere prazo, liquidez e o limite do FGC antes de mover dinheiro.</div>
    <div class="btns"><button class="ghost sm" onclick="invCompareId='';render()">Fechar</button></div>
  </div>`;
}

function viewSimulador() {
  const amount = SFCore.parseMoney(simForm.amount || '0');
  const valid = !Number.isNaN(amount) && amount > 0;
  let out = '';
  if (valid) {
    const a = simulate(S, amount, simForm.months, 'CDI', 1.0, 'CDB');
    const b = simulate(S, amount, simForm.months, 'CDI', simForm.pct, 'CDB');
    const lci = simulate(S, amount, simForm.months, 'CDI', 0.9, 'LCI');
    out = `<table class="audit"><thead><tr><th>Cenário</th><th class="rt">Líquido no fim</th><th class="rt">Ganho</th></tr></thead><tbody>
      <tr><td>100% do CDI (CDB/cofrinho)</td><td class="rt">${fmtBRL(a.net)}</td><td class="rt">${fmtBRL(a.netGain)}</td></tr>
      <tr class="good"><td>${pct(simForm.pct, 0)} do CDI (CDB)</td><td class="rt">${fmtBRL(b.net)}</td><td class="rt pos">${fmtBRL(b.netGain)}</td></tr>
      <tr><td>LCI 90% do CDI (isenta de IR)</td><td class="rt">${fmtBRL(lci.net)}</td><td class="rt">${fmtBRL(lci.netGain)}</td></tr>
      <tr><td><b>Diferença ${pct(simForm.pct,0)} × 100%</b></td><td class="rt"></td><td class="rt pos"><b>+${fmtBRL(b.netGain - a.netGain)}</b></td></tr>
    </tbody></table>

  }
  return `<div class="card">

    <button class="primary sm" onclick="render()">Calcular</button>
    ${out}
  </div>`;
}

async function fetchMarketAuto(silent) {
  marketFetch = { state: silent ? 'idle' : 'loading', message: '' };
  if (!silent) render();
  try {
    const [cdiJson, selicJson, ipcaJson] = await Promise.all(
      Object.values(SFCore.BCB_ENDPOINTS).map((url) =>
        fetch(url).then((r) => { if (!r.ok) throw new Error('o Banco Central respondeu com erro ' + r.status); return r.json(); })));
    const market = SFCore.buildMarketFromBcb({
      cdi: SFCore.parseBcbLatest(cdiJson), selic: SFCore.parseBcbLatest(selicJson), ipca: SFCore.parseBcbLatest(ipcaJson),
    });
    S.market = market; persist();
    marketFetch = { state: 'ok', message: `Atualizado: CDI ${(market.cdiAnnual*100).toFixed(2)}% · Selic ${(market.selicAnnual*100).toFixed(2)}% · IPCA ${(market.ipca12m*100).toFixed(2)}% (Banco Central/IBGE, ${fmtDate(market.consultedAt)}).` };
  } catch (e) {
    // tentativa silenciosa que falhou: não alarma o usuário, só deixa o botão manual disponível
    marketFetch = silent ? { state: 'idle', message: '' }
      : { state: 'error', message: 'Não consegui buscar agora (' + e.message + '). Se você abriu este arquivo direto da pasta de downloads, alguns navegadores bloqueiam essa conexão por segurança — nesse caso, use "Definir manualmente" ou instale/sirva o app por um endereço https.' };
  }
  render();
}
function saveMarket() {
  const num = (id) => { const v = SFCore.parseMoney($('#' + id).value || ''); return Number.isNaN(v) ? null : v / 10000; };
  const cdi = num('mk-cdi'), selic = num('mk-selic'), ipca = num('mk-ipca');
  if (cdi == null || selic == null || ipca == null) { alert('Informe CDI, Selic e IPCA.'); return; }
  S.market = { cdiAnnual: cdi, selicAnnual: selic, ipca12m: ipca, source: $('#mk-src').value.trim() || 'informado manualmente', consultedAt: today() };
  persist(); render();
}
function importOptions() {
  const raw = $('#mk-json').value.trim();
  if (!raw) return;
  try {
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) throw new Error('Esperado uma lista de ofertas.');
    S.marketOptions = arr.map((o) => ({
      id: uid(), institution: o.institution || '?', product: (o.product || 'CDB').toUpperCase(),
      index: o.index || 'CDI', pctOfIndex: o.pctOfIndex, preRate: o.preRate,
      liquidity: o.liquidity || 'DIARIA', minTermDays: o.minTermDays, minAmount: o.minAmount,
      fgc: o.fgc !== false, conditions: o.conditions, source: o.source || 'informado', consultedAt: o.consultedAt || today(),
    }));
    persist(); render();
  } catch (e) { alert('JSON inválido: ' + e.message); }
}
function addFromAccount(accId) {
  const inv = investmentFromAccount(S, accountById(S, accId));
  if (!inv) { alert('Essa conta ainda não tem lançamentos importados.'); return; }
  S.investments.push(inv); persist(); render();
}
function addInvestment() {
  const inst = $('#inv-inst').value.trim();
  const applied = SFCore.parseMoney($('#inv-applied').value || '');
  const bal = SFCore.parseMoney($('#inv-balance').value || '');
  const date = SFCore.brDateToISO($('#inv-date').value.trim());
  if (!inst || !date || Number.isNaN(applied) || Number.isNaN(bal)) { alert('Preencha instituição, data (dd/mm/aaaa), valor aplicado e saldo atual.'); return; }
  const p = parseFloat(($('#inv-pct').value || '100').replace(',', '.'));
  S.investments.push({
    id: uid(), institution: inst, type: $('#inv-type').value, appliedAt: date,
    appliedAmount: applied, currentBalance: bal, liquidity: $('#inv-liq').value,
    index: $('#inv-index').value, pctOfIndex: Number.isNaN(p) ? undefined : p / 100,
    maturity: SFCore.brDateToISO($('#inv-maturity').value.trim()) || undefined,
    fgc: $('#inv-fgc').checked,
  });
  persist(); render();
}
function removeInvestment(id) {
  if (!confirm('Remover este investimento do acompanhamento?')) return;

function askResetAccount(accountId) {
  const acc = accountById(S, accountId);

  const n = S.txs.filter((t) => t.accountId === accountId).length;
  const sure = confirm(
    `Reiniciar "${acc.name}"?\n\n` +
    `Isso apaga PERMANENTEMENTE desta conta:\n` +
    `· ${n} lançamento(s) importado(s)\n` +
    `· o histórico de conferência com o banco\n` +
    `· a âncora de saldo (o próximo extrato importado a define de novo)\n` +
    `· os registros de importação\n\n` +
    `NÃO mexe em: a conta em si, pessoas, categorias, metas ou investimentos cadastrados.\n\n` +
    `Depois disso, é só reimportar os extratos dessa conta do começo. Continuar?`
  );

  requireAuth(`Reiniciar a conta "${acc.name}", apagando ${n} lançamento(s) e todo o histórico dela.`, async () => {
    const r = resetAccount(S, accountId);

function askResetAll() {
  const n = S.txs.length;
  const accNames = S.accounts.map((a) => a.name).join(', ');
  // confirmação 1 de 2 — explica o alcance
  const sure1 = confirm(
    `Reiniciar TODAS as contas? (1/2)\n\n` +
    `Isso apaga PERMANENTEMENTE de todas as contas (${accNames || 'nenhuma cadastrada'}):\n` +
    `· ${n} lançamento(s) importado(s) no total\n` +
    `· todo o histórico de conferência com os bancos\n` +
    `· as âncoras de saldo (cada extrato reimportado define a de novo)\n` +
    `· todos os registros de importação\n\n` +
    `NÃO mexe em: as contas em si, pessoas, categorias, metas, investimentos cadastrados ou sua senha.\n\n` +
    `Quer continuar?`
  );
  if (!sure1) return;
  // confirmação 2 de 2 — último aviso, sem meio-termo
  const sure2 = confirm(
    `Confirme de novo (2/2)\n\n` +
    `Tem certeza? Isso vai apagar ${n} lançamento(s) de ${S.accounts.length} conta(s) AGORA, sem volta.\n\n` +
    `Toque OK só se realmente quiser reimportar tudo do zero.`
  );

  requireAuth(`Reiniciar TODAS as contas, apagando ${n} lançamento(s) no total.`, async () => {
    const r = resetAllAccounts(S);
    SFSec.logEvent(S, 'ACAO_CRITICA', null, `todas as contas reiniciadas — ${r.removed} lançamento(s) removido(s) em ${r.accounts} conta(s)`);
  });

function askUndoLastImport() {
  const last = S.batches.find((b) => b.status === 'COMMITTED');
  if (!last) { alert('Não há nenhuma importação para desfazer.'); return; }
  const acc = accountById(S, last.accountId);
  const n = S.txs.filter((t) => t.batchId === last.id).length;
  if (!confirm(`Desfazer a última importação?\n\n"${last.fileName}" em ${acc ? acc.name : '?'} · ${n} lançamento(s).\n\nContinuar?`)) return;
  requireAuth(`Desfazer a última importação ("${last.fileName}"), removendo ${n} lançamento(s).`, async () => {
    const r = undoLastImport(S);
    SFSec.logEvent(S, 'ACAO_CRITICA', null, `última importação desfeita — ${r.removed} lançamento(s) removido(s)`);
  });
}

function askRemoveAccount(accountId) {
  const acc = accountById(S, accountId);
  if (!acc) return;
  const n = S.txs.filter((t) => t.accountId === accountId).length;
  if (n > 0) {
    alert(`Não dá para excluir "${acc.name}" ainda — ela tem ${n} lançamento(s).\n\nReinicie a conta primeiro (botão ⟲, esvazia sem excluir) e tente de novo.`);
    return;
  }
  if (!confirm(`Excluir a conta "${acc.name}" permanentemente?\n\nEla está vazia, então não há lançamento para perder. Investimentos ou metas vinculados a ela continuam existindo, só perdem o vínculo automático.`)) return;
  requireAuth(`Excluir a conta "${acc.name}".`, async () => {
    const r = removeAccount(S, accountId);
    if (r.removed) SFSec.logEvent(S, 'ACAO_CRITICA', null, `conta "${acc.name}" excluída`);
  });
}

let categoryForm = { open: false, editId: null, name: '', kind: 'DESPESA' };

function manualTxForm() {
  const isEdit = !!manualForm.editId;
  return `<div class="form manualform">
    <div class="row"><div class="grow"><b>${isEdit ? 'Alterar lançamento' : 'Novo lançamento manual'}</b></div>

    <select id="mt-cat"><option value="">Sem categoria</option>${S.categories.map((c) => `<option value="${c.id}" ${manualForm.categoryId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <div class="btns">

    </div>

function openEditTx(txId) {
  const t = S.txs.find((x) => x.id === txId);
  if (!t) return;
  manualForm = { open: true, editId: txId, date: fmtDate(t.date), amount: (t.amount / 100).toFixed(2).replace('.', ','), description: t.descriptionRaw, categoryId: t.categoryId || '' };
  render();
}
function openNewManualTx() {
  if (!extAccount) { alert('Escolha uma conta específica no filtro acima antes de incluir um lançamento manual.'); return; }
  manualForm = { open: true, editId: null, date: fmtDate(today()), amount: '', description: '', categoryId: '' };
  render();
}
function closeManualForm() { manualForm = { open: false, editId: null, date: '', amount: '', description: '', categoryId: '' }; render(); }

function readManualForm() {
  const date = SFCore.brDateToISO($('#mt-date').value.trim());
  const amount = SFCore.parseMoney($('#mt-amount').value || '');
  const description = $('#mt-desc').value.trim();
  const categoryId = $('#mt-cat').value || null;
  if (!date) { alert('Data inválida — use dd/mm/aaaa.'); return null; }
  if (Number.isNaN(amount) || amount === 0) { alert('Informe um valor diferente de zero.'); return null; }
  if (!description) { alert('Informe uma descrição.'); return null; }
  return { date, amount, description, categoryId };
}
function saveManualTx() {
  const data = readManualForm();
  if (!data) return;
  if (manualForm.editId) {
    const editId = manualForm.editId; // capturado antes de fechar o formulário — closeManualForm() zera manualForm.editId
    const t = S.txs.find((x) => x.id === editId);
    if (!t) { closeManualForm(); return; }
    // só a categoria mudou: não precisa reautenticar a cada alteração
    const onlyCategoryChanged = data.date === t.date && data.amount === t.amount && data.description === t.descriptionRaw;
    if (onlyCategoryChanged) {
      updateTx(S, editId, data);
      SFSec.logEvent(S, 'ACAO_CRITICA', null, `categoria do lançamento alterada`);
      persistNow();
      closeManualForm();
      return;
    }
    const label = t.descriptionRaw;
    requireAuth(`Alterar o lançamento "${label}".`, async () => {
      updateTx(S, editId, data);
      SFSec.logEvent(S, 'ACAO_CRITICA', null, `lançamento alterado manualmente`);
    });
    closeManualForm();
  } else {
    addManualTx(S, extAccount, data);
    persistNow();
    closeManualForm();
  }
}
function deleteManualTx(txId) {
  const t = S.txs.find((x) => x.id === txId);
  if (!t) return;
  if (!confirm(`Excluir "${t.descriptionRaw}" (${fmtBRL(t.amount)})?`)) return;
  requireAuth(`Excluir o lançamento "${t.descriptionRaw}".`, async () => {
    deleteTx(S, txId);
    SFSec.logEvent(S, 'ACAO_CRITICA', null, `lançamento excluído manualmente`);
  });
  closeManualForm();
}

const INV_QUICK_LABELS = { APORTE: 'Aporte', RESGATE: 'Resgate', RENDIMENTO: 'Rendimento' };
const INV_QUICK_DESC_WORD = { APORTE: 'Aplicação', RESGATE: 'Resgate', RENDIMENTO: 'Rendimento' };
function openInvQuick(invId, kind) {
  invQuickForm = { open: true, invId, kind, date: fmtDate(today()), amount: '' };
  render();
}

function invQuickFormHtml(inv) {
  const label = INV_QUICK_LABELS[invQuickForm.kind];
  const helpByKind = {
    APORTE: 'Dinheiro que você colocou no cofrinho/investimento.',
    RESGATE: 'Dinheiro que você retirou. Se caiu em outra conta sua, lance também uma entrada lá com a mesma data e valor, descrição "Transferência".',
    RENDIMENTO: 'O que rendeu no período: saldo atual − saldo anterior − aportes + resgates.',
  };
  return `<div class="form">
    <div class="hint">${helpByKind[invQuickForm.kind]}</div>
    <input id="iq-date" placeholder="Data (dd/mm/aaaa)" value="${esc(invQuickForm.date)}">
    <input id="iq-amount" placeholder="Valor (ex.: 50,00)" value="${esc(invQuickForm.amount)}">
    <div class="btns">
      <button class="primary sm" onclick="saveInvQuick()">Salvar ${label.toLowerCase()}</button>
      <button class="ghost sm" onclick="closeInvQuick()">Cancelar</button>
    </div>
  </div>`;
}
function saveInvQuick() {
  const inv = S.investments.find((i) => i.id === invQuickForm.invId);
  if (!inv) return;
  const date = SFCore.brDateToISO($('#iq-date').value.trim());
  let amount = SFCore.parseMoney($('#iq-amount').value || '');
  if (!date) { alert('Data inválida — use dd/mm/aaaa.'); return; }
  if (Number.isNaN(amount) || amount === 0) { alert('Informe um valor diferente de zero.'); return; }
  amount = Math.abs(amount);
  const kind = invQuickForm.kind;
  const signedAmount = kind === 'RESGATE' ? -amount : amount;

  if (inv.accountId) {
    // Investimento vinculado a uma conta: lança no extrato e o saldo se recalcula sozinho
    const description = `${INV_QUICK_DESC_WORD[kind]} ${inv.institution}`;
    addManualTx(S, inv.accountId, { date, amount: signedAmount, description, categoryId: null });
  } else {
    // Investimento avulso: ajusta os valores do próprio investimento
    if (kind === 'RESGATE' && amount > (inv.currentBalance || 0)) {
      alert('O resgate é maior que o saldo atual do investimento.');
      return;
    }
    inv.currentBalance = (inv.currentBalance || 0) + signedAmount;
    // Aporte e resgate mexem no capital aplicado; rendimento não (é ganho, não dinheiro novo)
    if (kind === 'APORTE') inv.appliedAmount = (inv.appliedAmount || 0) + amount;
    if (kind === 'RESGATE') inv.appliedAmount = Math.max(0, (inv.appliedAmount || 0) - amount);
  }
  persistNow();
  closeInvQuick();
}

// ───────── ações ─────────
function toggle(id) { $('#' + id).classList.toggle('hidden'); tutorialAtualizarBalao(); }
function addPerson() {
  const name = $('#person-name').value.trim();
  if (!name) return;
  S.people.push({ id: uid(), name });
  try { SFTelemetry.track('member_added'); } catch (e) {}
  persist(); render();
}
function askRemovePerson(personId) {
  const p = S.people.find((x) => x.id === personId);
  if (!p) return;
  const accounts = S.accounts.filter((a) => a.ownerId === personId);
  if (accounts.length) {
    alert(
      `Não dá para excluir "${p.name}" enquanto ela tiver conta cadastrada.\n\n` +
      `${accounts.length === 1 ? 'Exclua esta conta' : 'Exclua estas contas'} primeiro (esvazie com ⟲ e depois exclua):\n` +
      accounts.map((a) => `· ${a.name}`).join('\n') +
      `\n\nDepois disso, "${p.name}" pode ser excluída.`
    );
    return;
  }
  if (!confirm(`Excluir "${p.name}" permanentemente?\n\nEla não tem nenhuma conta cadastrada.`)) return;
  requireAuth(`Excluir a pessoa "${p.name}" da família.`, async () => {
    const r = removePerson(S, personId);
    if (r.removed) SFSec.logEvent(S, 'ACAO_CRITICA', null, `pessoa "${p.name}" excluída`);
  });
}
/* ───────── Categorias: cadastrar, alterar, excluir ───────── */
function openNewCategory() { categoryForm = { open: true, editId: null, name: '', kind: 'DESPESA' }; render(); }
function openEditCategory(catId) {
  const c = S.categories.find((x) => x.id === catId);
  if (!c) return;
  categoryForm = { open: true, editId: catId, name: c.name, kind: c.kind };
  render();
}
function closeCategoryForm() { categoryForm = { open: false, editId: null, name: '', kind: 'DESPESA' }; render(); }
function saveCategoryForm() {
  const name = $('#catf-name').value.trim();
  const kind = $('#catf-kind').value;
  if (!name) { alert('Informe um nome para a categoria.'); return; }
  const dup = S.categories.find((c) => c.id !== categoryForm.editId && c.name.trim().toLowerCase() === name.toLowerCase());
  if (dup) { alert(`Já existe uma categoria chamada "${dup.name}".`); return; }
  if (categoryForm.editId) {
    const c = S.categories.find((x) => x.id === categoryForm.editId);
    if (c) { c.name = name; c.kind = kind; }
  } else {
    S.categories.push({ id: uid(), name, kind });
  }
  persist();
  closeCategoryForm();
}
function askRemoveCategory(catId) {
  const c = S.categories.find((x) => x.id === catId);
  if (!c) return;
  const usedTxs = S.txs.filter((t) => t.categoryId === catId).length;
  const usedPlanned = (S.planned || []).filter((p) => p.categoryId === catId).length;
  if (usedTxs || usedPlanned) {
    alert(
      `Não dá para excluir "${c.name}" enquanto ela estiver em uso.\n\n` +
      `${usedTxs ? `· ${usedTxs} lançamento(s)\n` : ''}${usedPlanned ? `· ${usedPlanned} previsão(ões)\n` : ''}` +
      `\nAltere a categoria desses itens (ou deixe "Sem categoria") e depois exclua "${c.name}".`
    );
    return;
  }
  if (!confirm(`Excluir a categoria "${c.name}" permanentemente?`)) return;
  S.categories = S.categories.filter((x) => x.id !== catId);
  S.rules = S.rules.filter((r) => r.categoryId !== catId); // regras de classificação automática que apontavam pra ela deixam de existir
  persist(); render();
}
function categoryFormHtml() {
  const isEdit = !!categoryForm.editId;
  return `<div class="form">
    <input id="catf-name" placeholder="Nome da categoria" value="${esc(categoryForm.name)}">
    <select id="catf-kind">
      <option value="DESPESA" ${categoryForm.kind === 'DESPESA' ? 'selected' : ''}>Despesa</option>
      <option value="RECEITA" ${categoryForm.kind === 'RECEITA' ? 'selected' : ''}>Receita</option>

    <div class="btns">
      <button class="primary sm" onclick="saveCategoryForm()">${isEdit ? 'Salvar alteração' : 'Adicionar categoria'}</button>
      <button class="ghost sm" onclick="closeCategoryForm()">Cancelar</button>

}
function categoriesCard() {

  return `<div class="card">
    <h3>Categorias <button class="primary sm right" onclick="openNewCategory()">Nova categoria</button></h3>

/* ═══════════ Tela do cartão de crédito ═══════════ */
let cardTab = null;           // cartão selecionado

let linkPayPicker = null;     // { cardId, invoiceKey } — quando o seletor de "já paguei" está aberto

const INVOICE_LABEL = { ABERTA: 'Fatura aberta', FUTURA: 'Fatura futura', FECHADA: 'Fechada — a pagar',
                        PARCIAL: 'Parcialmente paga', VENCIDA: 'VENCIDA', PAGA: 'Paga' };
const INVOICE_TONE = { ABERTA: 'chip', FUTURA: 'chip', FECHADA: 'chip warn', PARCIAL: 'chip warn',
                       VENCIDA: 'chip danger', PAGA: 'chip good' };

function viewCartoes() {
  const cards = S.accounts.filter(isCard);

    return `<div class="card">

  }

    `<button class="chip clickable ${c.id === cardTab ? 'sel' : ''}" onclick="cardTab='${c.id}';cardPayForm=null;linkPayPicker=null;render()">${esc(c.name)}</button>`).join('')}</div></div>` : ''}

    <div class="row"><div class="grow"><h3>${esc(card.name)}</h3>

    ${sum.limit ? `
      <div class="limitbar"><div class="limitfill ${sum.usedPct > 0.8 ? 'danger' : sum.usedPct > 0.5 ? 'warn' : ''}" style="width:${(sum.usedPct * 100).toFixed(1)}%"></div></div>
      <div class="row"><div class="grow sub">Usado ${fmtBRL(sum.debt)} de ${fmtBRL(sum.limit)}</div>
        <div class="amt ${sum.available > 0 ? 'pos' : 'neg'}">${fmtBRL(sum.available)} livres</div></div>`
      : '<div class="hint">Cadastre o limite do cartão para acompanhar quanto ainda está disponível.</div>'}
    ${sum.bestBuyDay ? `<div class="suggestion">💡 <b>Melhor dia de compra: ${sum.bestBuyDay}.</b> Comprando logo depois do fechamento você ganha o prazo máximo até o vencimento.</div>` : ''}
  </div>

  <div class="card">

      <div class="amt">${fmtBRL(sum.current.total)}</div></div>
    <div class="hint">Ainda pode mudar até o fechamento${sum.daysToClose >= 0 ? ` (faltam ${sum.daysToClose} dia(s))` : ''}.</div>
  </div>` : ''}

  ${sum.toPay.length ? sum.toPay.map((inv) => `
  <div class="card">
    <div class="row"><div class="grow"><b>Fatura de ${fmtDate(inv.dueDate)}</b>
      <div><span class="${INVOICE_TONE[inv.status]}">${INVOICE_LABEL[inv.status]}</span></div></div>
      <div class="amt neg">${fmtBRL(inv.remaining)}</div></div>
    ${inv.paid > 0 ? `<div class="sub">Total ${fmtBRL(inv.total)} · já pago ${fmtBRL(inv.paid)}</div>` : ''}
    ${(() => { const c = findPaymentCandidates(S, card.id, inv.key)[0]; return c && !(linkPayPicker && linkPayPicker.invoiceKey === inv.key) ? `<div class="hint" style="border-left:3px solid var(--brass);padding-left:10px;margin:8px 0">Este débito parece ser o pagamento desta fatura: <b>${esc(c.descriptionRaw)}</b> · ${fmtBRL(c.amount)} em ${fmtDate(c.date)}.<div class="btns" style="margin-top:6px"><button class="primary sm" onclick="confirmLinkPay('${c.id}','${card.id}','${inv.key}')">Foi este — vincular</button></div></div>` : ''; })()}
    <div class="btns">
      <button class="primary sm" onclick="openCardPay('${card.id}','${inv.key}',${inv.remaining})">Pagar fatura</button>
      <button class="ghost sm" onclick="openLinkPay('${card.id}','${inv.key}')">Já paguei — escolher o pagamento</button>
    </div>
    ${cardPayForm && cardPayForm.invoiceKey === inv.key ? cardPayFormHtml(card, inv) : ''}
    ${linkPayPicker && linkPayPicker.invoiceKey === inv.key ? linkPayPickerHtml(card, inv) : ''}
  </div>`).join('') : '<div class="card"><div class="empty">Nenhuma fatura fechada aguardando pagamento.</div></div>'}

  ${sum.committedAhead > 0 ? `

    <table class="audit">

        .map((i) => `<tr><td>Vence ${fmtDate(i.dueDate)}</td><td class="amt">${fmtBRL(i.total)}</td></tr>`).join('')}

  <div class="card">

/** Avisos de fechamento, vencimento, limite e rotativo. */
function cardAlerts(sum) {
  const out = [];
  const d = sum.daysToDue;
  if (sum.nextDue) {
    if (d < 0) out.push({ tone: 'error', text: `<b>Fatura vencida há ${-d} dia(s):</b> ${fmtBRL(sum.nextDue.remaining)}. Juros do rotativo são os mais altos do mercado — quite ou negocie o quanto antes.` });
    else if (d === 0) out.push({ tone: 'error', text: `<b>A fatura vence HOJE:</b> ${fmtBRL(sum.nextDue.remaining)}.` });
    else if (d <= 5) out.push({ tone: 'banner', text: `<b>Fatura vence em ${d} dia(s):</b> ${fmtBRL(sum.nextDue.remaining)}.` });
  }
  if (sum.daysToClose != null && sum.daysToClose >= 0 && sum.daysToClose <= 3 && sum.current) {
    out.push({ tone: 'banner', text: `<b>A fatura fecha em ${sum.daysToClose} dia(s)</b> com ${fmtBRL(sum.current.total)} até agora. Compras a partir do dia ${sum.bestBuyDay} já caem na fatura seguinte.` });
  }
  if (sum.usedPct != null && sum.usedPct >= 0.8) {
    out.push({ tone: 'banner', text: `<b>Limite quase no fim:</b> ${(sum.usedPct * 100).toFixed(0)}% usado, restam ${fmtBRL(sum.available)}.` });
  }
  return out;
}

function openCardPay(cardId, invoiceKey, max) {
  cardPayForm = { cardId, invoiceKey, max };
  linkPayPicker = null;
  render();
}
function openLinkPay(cardId, invoiceKey) {
  linkPayPicker = { cardId, invoiceKey };
  cardPayForm = null;
  render();
}
function linkPayPickerHtml(card, inv) {
  const strict = findPaymentCandidates(S, card.id, inv.key);
  const loose = findLoosePaymentCandidates(S, card.id, inv.key);
  const row = (t) => {
    const acc = accountById(S, t.accountId);
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid #eee">
        <div class="grow"><b>${esc(t.descriptionRaw)}</b><div class="sub">${fmtDate(t.date)} · ${esc(acc ? acc.name : '')}</div></div>
        <div class="amt neg">${fmtBRL(t.amount)}</div>
        <button class="primary sm" onclick="confirmLinkPay('${t.id}','${card.id}','${inv.key}')">Usar este</button>
      </div>`;
  };
  return `<div class="form">
    <div class="hint">Escolha o lançamento que foi o pagamento desta fatura (Pix, transferência, débito automático). Ele deixa de contar como despesa e vira o pagamento do cartão — assim o mesmo gasto não é contado duas vezes.</div>
    ${strict.length ? `<div class="sub" style="margin-top:8px"><b>Parece ser este:</b></div>${strict.map(row).join('')}` : '<div class="empty">Nenhum débito com o valor da fatura.</div>'}
    ${loose.length ? `<div class="sub" style="margin-top:12px"><b>Outros débitos perto do vencimento:</b></div>${loose.map(row).join('')}` : ''}
    <div class="hint" style="margin-top:10px">Se o pagamento saiu de outra conta da família, use <b>Pagar fatura</b> escolhendo essa conta como origem. Só use <b>Pagar fatura</b> se o pagamento ainda não aparece em nenhuma conta — senão ele é lançado duas vezes.</div>
    <div class="btns"><button class="ghost sm" onclick="linkPayPicker=null;render()">Cancelar</button></div>
  </div>`;
}
function confirmLinkPay(txId, cardId, invoiceKey) {
  const tx = S.txs.find((t) => t.id === txId);
  const card = S.accounts.find((a) => a.id === cardId);
  const inv = card && invoicesOf(S, card).find((i) => i.key === invoiceKey);
  let aviso = '';
  if (tx && inv) {
    const v = Math.abs(tx.amount);
    if (v < inv.remaining - 5) aviso = `\n\nAtenção: este débito (${fmtBRL(v)}) é menor que o que falta na fatura (${fmtBRL(inv.remaining)}). Conta como pagamento parcial e ainda ficam ${fmtBRL(inv.remaining - v)} em aberto.`;
    else if (v > inv.remaining + 5) aviso = `\n\nAtenção: este débito (${fmtBRL(v)}) é maior que o que falta na fatura (${fmtBRL(inv.remaining)}). A diferença de ${fmtBRL(v - inv.remaining)} fica como crédito no cartão.`;
  }
  if (!confirm('Vincular este lançamento como pagamento da fatura? Ele deixa de contar como despesa avulsa e passa a ser o pagamento do cartão.' + aviso)) return;
  try {
    linkExistingAsCardPayment(S, txId, cardId, invoiceKey);
    persistNow(); linkPayPicker = null; render();
  } catch (e) { alert(e.message); }
}
function cardPayFormHtml(card, inv) {
  const contas = S.accounts.filter((a) => !isCard(a));
  const padrao = card.paymentAccountId || (contas[0] && contas[0].id) || '';
  return `<div class="form">
    <div class="hint">O valor sai da conta escolhida e abate a fatura. Como é transferência, não conta como despesa nova — a despesa foi a compra.</div>
    <input id="cp-date" placeholder="Data do pagamento (dd/mm/aaaa)" value="${fmtDate(today())}">
    <input id="cp-amount" placeholder="Valor" value="${(inv.remaining / 100).toFixed(2).replace('.', ',')}">
    <select id="cp-from">${contas.map((a) => `<option value="${a.id}" ${a.id === padrao ? 'selected' : ''}>${esc(a.name)} · ${fmtBRL(balance(S, a))}</option>`).join('')}</select>
    <div class="chips">
      <button class="chip clickable" onclick="setPayAmount(${inv.remaining})">Total ${fmtBRL(inv.remaining)}</button>
      <button class="chip clickable" onclick="setPayAmount(${Math.round(inv.remaining * 0.5)})">Metade</button>
      <button class="chip clickable" onclick="setPayAmount(${Math.round(inv.total * 0.15)})">Mínimo (15%)</button>
    </div>
    <div id="cp-warn"></div>
    <div class="btns">
      <button class="primary sm" onclick="saveCardPay()">Confirmar pagamento</button>
      <button class="ghost sm" onclick="cardPayForm=null;render()">Cancelar</button>

function setPayAmount(cents) {
  const el = $('#cp-amount');
  if (el) el.value = (cents / 100).toFixed(2).replace('.', ',');
  showRotativoWarn();
}
/** Avisa o custo de deixar saldo no rotativo ao pagar menos que o total. */
function showRotativoWarn() {
  const box = $('#cp-warn'); if (!box || !cardPayForm) return;
  const v = SFCore.parseMoney($('#cp-amount').value || '');
  const resta = cardPayForm.max - (Number.isNaN(v) ? 0 : Math.abs(v));
  if (resta <= 0) { box.innerHTML = ''; return; }
  // taxa média do rotativo no Brasil gira em torno de 14% ao mês
  const juros = Math.round(resta * 0.14);
  box.innerHTML = `<div class="warnline">Sobram ${fmtBRL(resta)} no rotativo. A juros de cerca de 14% ao mês, isso vira aproximadamente <b>${fmtBRL(resta + juros)}</b> na próxima fatura (${fmtBRL(juros)} só de juros). Se puder, pague o total.</div>`;
}
function saveCardPay() {
  if (!cardPayForm) return;
  const date = SFCore.brDateToISO(($('#cp-date').value || '').trim());
  const v = SFCore.parseMoney($('#cp-amount').value || '');
  const from = $('#cp-from').value;
  if (!date) { alert('Data inválida — use dd/mm/aaaa.'); return; }
  if (Number.isNaN(v) || v === 0) { alert('Informe o valor do pagamento.'); return; }
  if (!from) { alert('Escolha a conta de onde sai o pagamento.'); return; }
  const amount = Math.abs(v);
  if (amount > cardPayForm.max) {
    if (!confirm(`O valor é maior que o saldo da fatura (${fmtBRL(cardPayForm.max)}). Confirmar mesmo assim?`)) return;
  }
  try {
    payInvoice(S, cardPayForm.cardId, cardPayForm.invoiceKey, amount, date, from);
    persistNow(); cardPayForm = null; render();
  } catch (e) { alert(e.message); }
}

function cardBuyFormHtml(card) {
  return `<div class="form">
    <input id="cb-date" placeholder="Data da compra (dd/mm/aaaa)" value="${fmtDate(today())}">
    <input id="cb-desc" placeholder="Descrição (ex.: Geladeira)">
    <input id="cb-amount" placeholder="Valor total da compra">
    <input id="cb-inst" placeholder="Número de parcelas (1 = à vista)" value="1" inputmode="numeric">
    <select id="cb-cat"><option value="">Sem categoria</option>${S.categories.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <div class="hint">Em compra parcelada, cada parcela cai automaticamente na fatura do mês correspondente.</div>
    <div class="btns">
      <button class="primary sm" onclick="saveCardBuy()">Lançar compra</button>
      <button class="ghost sm" onclick="cardBuyOpen=false;render()">Cancelar</button>
    </div>
  </div>`;
}
function saveCardBuy() {
  const date = SFCore.brDateToISO(($('#cb-date').value || '').trim());
  const desc = ($('#cb-desc').value || '').trim();
  const v = SFCore.parseMoney($('#cb-amount').value || '');
  const n = parseInt(($('#cb-inst').value || '1').replace(/\D/g, ''), 10) || 1;
  if (!date) { alert('Data inválida — use dd/mm/aaaa.'); return; }
  if (!desc) { alert('Informe a descrição da compra.'); return; }
  if (Number.isNaN(v) || v === 0) { alert('Informe o valor da compra.'); return; }
  try {
    addCardInstallments(S, cardTab, { date, totalCents: Math.abs(v), description: desc,
      categoryId: $('#cb-cat').value || null, installments: n });
    persistNow(); cardBuyOpen = false; render();
  } catch (e) { alert(e.message); }
}

function toggleCardFields() {
  const box = $('#acc-card-fields');
  if (box) box.classList.toggle('hidden', $('#acc-type').value !== 'CARTAO');
}
function toggleCustomBankField() {
  const el = $('#acc-inst-custom');
  if (!el) return;
  el.classList.toggle('hidden', $('#acc-inst').value !== 'OUTRO');
}
function addAccount() {
  const name = $('#acc-name').value.trim();
  if (!name) return;
  const type = $('#acc-type').value;
  const inst = $('#acc-inst').value;
  const customBank = inst === 'OUTRO' ? ($('#acc-inst-custom').value || '').trim() : '';
  const acc = { id: uid(), name, institution: inst, customBankName: customBank || null, type,
    ownerId: $('#acc-owner').value, anchorBalance: null, anchorDate: null, anchorBatchId: null };
  if (type === 'CARTAO') {
    const dia = (sel) => { const n = parseInt(($(sel).value || '').replace(/\D/g, ''), 10); return (n >= 1 && n <= 31) ? n : null; };
    acc.closingDay = dia('#acc-closing');
    acc.dueDay = dia('#acc-due');
    const lim = SFCore.parseMoney($('#acc-limit').value || '');
    acc.creditLimit = Number.isNaN(lim) ? null : Math.abs(lim);
    acc.paymentAccountId = $('#acc-payfrom').value || null;
    acc.anchorBalance = 0;   // cartão começa sem dívida; as compras é que formam o saldo
    if (!acc.closingDay || !acc.dueDay) { alert('Informe o dia de fechamento e o de vencimento da fatura.'); return; }
  }
  S.accounts.push(acc);
  persistNow(); render();
}
async function impFile(file) {
  if (!file) return;
  imp.busy = true; imp.error = ''; render();
  try {
    const parsed = await parseAnyFile(file);
    imp.txs = parsed.txs; imp.statement = parsed;
    imp.calibration = parsed.calibration || null; imp.lines = parsed.lines || null;
    imp.resolution = parsed.resolution || null;
    imp.fileName = file.name;
    // o app propõe a conta; o usuário confirma ou troca
    imp.accountId = (imp.resolution && imp.resolution.confident && imp.resolution.best)
      ? imp.resolution.best.account.id : '';
    imp.override = false;
    imp.step = 1;
  } catch (e) { imp.error = e.message; }
  imp.busy = false; render();
}
function impCommit() {
  try {
    const decisions = imp.rows.filter((r) => r.verdict !== 'DUP_EXACT')
      .map((r) => ({ index: r.index, include: imp.include[r.index] === true, categoryId: imp.cat[r.index] || (imp.include[r.index] ? r.suggestedCategoryId : undefined) || undefined }));
    if (imp.calibration && imp.calibration.trustworthy && !imp.calibration.isInvoice) {
      const contaSel = accountById(S, imp.accountId) || {};
      const inst = layoutProfileKey((imp.resolution && imp.resolution.identity.institution) || contaSel.institution || 'OUTRO', contaSel.customBankName);
      saveLayoutProfile(S, inst, imp.calibration.strategy, imp.calibration.confidence);
    }
    if (imp.resolution) learnAccountIdentity(S, imp.accountId, imp.resolution.identity);
    imp.result = commitImport(S, imp.accountId, imp.fileName, imp.txs, decisions, imp.statement);
    persistNow();
    imp.step = 3;
  } catch (e) { imp.error = e.message; }
  render();
}
function impReset() { imp = { step: 0, accountId: '', fileName: '', txs: [], statement: null, rows: [], include: {}, cat: {}, result: null, busy: false, error: '', calibration: null, lines: null, closingHint: '', resolution: null, identity: null, override: false, overrideStep: 0 }; render(); }
function exportBackup() {
  requireAuth('Exportar todos os seus dados em um arquivo de backup.', async () => {
    const paraTransferencia = confirm(
      'Esse backup é para levar sua conta pra OUTRO aparelho?\n\n' +
      'OK = Sim, vou instalar/restaurar em outro aparelho agora (a licença deste aparelho será desativada depois de gerar o arquivo)\n\n' +
      'Cancelar = Não, é só uma cópia de segurança (nada muda neste aparelho)'
    );
    const pwd = prompt('Senha para proteger o arquivo de backup (você precisará dela para restaurar):');
    if (!pwd || pwd.length < 8) { alert('Use uma senha de pelo menos 8 caracteres.'); return; }
    const content = await SFSec.exportEncrypted(S, pwd);
    baixarArquivo('smart-finance-backup-' + new Date().toISOString().slice(0, 10) + '.sfbackup.json', new Blob([content], { type: 'application/json' }));
    SFSec.logEvent(S, 'BACKUP_EXPORTADO', null, paraTransferencia ? 'transferência para outro aparelho' : 'cópia de segurança');
    if (paraTransferencia) {
      // Este aparelho perde a licença agora — o arquivo já foi gerado com ela dentro,
      // então o aparelho novo (ou este mesmo, se restaurar de volta aqui) recupera o acesso.
      S.license = null;
      persistNow();
      alert('Backup gerado.\n\nEste aparelho não tem mais licença ativa. Restaure esse arquivo no aparelho novo (Segurança > Restaurar backup) pra continuar usando por lá.');
      render();
    }
  });
}
function importBackup(file) {
  if (!file) return;
  requireAuth('Restaurar um backup, substituindo os dados atuais.', async () => {
    try {
      const text = await file.text();
      const pwd = prompt('Senha do arquivo de backup:');
      if (!pwd) return;
      const data = await SFSec.importEncrypted(text, pwd);
      if (!data || !Array.isArray(data.txs)) throw new Error('Arquivo de backup inválido.');
      if (!confirm('Restaurar este backup? Os dados atuais deste aparelho serão substituídos.')) return;
      const events = (S.security && S.security.events) || [];
      S = migrateState(data);
      S.security.events = events; // o histórico de segurança deste aparelho é preservado
      SFSec.logEvent(S, 'BACKUP_RESTAURADO', null, file.name);
    } catch (e) { alert(e.message); }
  });
}

/* ── olho de privacidade: oculta/mostra valores, sempre começa oculto ── */
function toggleEye() {
  setValuesHidden(!isValuesHidden());

}
function syncEyeIcon() {
  const btn = $('#eye-toggle');
  if (!btn) return;
  const hidden = isValuesHidden();
  btn.textContent = hidden ? '🙈' : '👁';
